@if (open) {
  <div class="modal-backdrop" (click)="cerrar()">
    <div
      #dialog
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
      (click)="$event.stopPropagation()"
    >
      <h3 id="confirm-title">{{ title }}</h3>
      <p id="confirm-message" class="modal-message">{{ message }}</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" [disabled]="busy" (click)="cerrar()">Cancelar</button>
        <button
          #confirmBtn
          class="btn"
          [class.btn-danger]="danger"
          [class.btn-primary]="!danger"
          type="button"
          [disabled]="busy"
          (click)="confirm.emit()"
        >
          @if (busy) { <span class="spinner" aria-hidden="true"></span> }
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
