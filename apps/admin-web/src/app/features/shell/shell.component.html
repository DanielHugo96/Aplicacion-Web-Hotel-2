<div class="shell" [class.collapsed]="collapsed()">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word" [attr.aria-label]="'Casa Sillar, ' + tituloArea()">
        @if (collapsed()) {
          <span aria-hidden="true">C</span>
        } @else {
          <span class="brand-word__casa" aria-hidden="true">Casa</span>
          <span class="brand-word__sillar" aria-hidden="true">Sillar</span>
        }
      </span>
    </div>
    <nav class="menu">
      <a
        *ngFor="let item of menu"
        [routerLink]="item.path"
        routerLinkActive="active"
        [attr.aria-current]="esActivo(item.path) ? 'page' : null"
        [attr.aria-hidden]="!estaVisible(item) ? 'true' : null"
        [attr.tabindex]="estaVisible(item) ? null : -1"
        [class.visible]="estaVisible(item)"
        [class.hidden]="!estaVisible(item)"
        (click)="cerrarMenuSiMovil()"
      >
        <span class="item-label">{{ item.label }}</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-link toggle" (click)="toggle()" [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Colapsar menú'">
        <span class="toggle-text" *ngIf="!collapsed()">{{ collapsed() ? 'Mostrar' : 'Ocultar' }} menú</span>
        <span class="monospace">{{ collapsed() ? '≡' : '⟨' }}</span>
      </button>
    </div>
  </aside>

  <div class="shell-main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn btn-secondary mobile-menu" type="button" (click)="toggle()" aria-label="Abrir menú">
          Menú
        </button>
        <label class="sede-label" for="sede-select">Sede</label>
        <select
          id="sede-select"
          class="sede-select"
          aria-label="Selector de sede (filtro de trabajo)"
          [value]="sedesContext.selectedId() ?? ''"
          (change)="cambiarSede($event)"
        >
          @if (sedesContext.sedes().length === 0) {
            <option value="">Sin sede asignada</option>
          }
          @for (sede of sedesContext.sedes(); track sede.idHotel) {
            <option [value]="sede.idHotel">{{ sede.nombre }}</option>
          }
        </select>
        <span class="demo" aria-hidden="true">Presentación</span>
      </div>
      <div class="topbar-right">
        <div class="persona" *ngIf="persona()">
          <span class="nombre">{{ persona()?.nombre }} {{ persona()?.apellido }}</span>
          <span class="rol-chip">{{ rol() }}</span>
        </div>
        <div class="account-menu">
          <button class="btn btn-link" (click)="irPerfil()">
            {{ rol() === 'CLIENTE' ? 'Mi perfil' : 'Mi perfil' }}
          </button>
          <button class="btn btn-link" (click)="logout()">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
    <app-toast></app-toast>
  </div>
</div>
