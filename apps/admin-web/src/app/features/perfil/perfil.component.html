<div class="page">
  <h1>{{ titulo }}</h1>
  <p class="sub">Edita tu nombre, apellidos y URL de foto.</p>

  @if (error()) {
    <div class="banner banner-error" role="alert">{{ error() }}</div>
  }

  @if (loading()) {
    <div class="skeleton" style="height: 64px; width: 200px;" aria-label="Cargando perfil"></div>
  } @else {
    <app-perfil-form [persona]="persona()" (saved)="onPasswordSaved()"></app-perfil-form>
  }
</div>
