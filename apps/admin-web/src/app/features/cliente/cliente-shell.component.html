<div class="cliente-shell">
  <header class="cliente-topbar">
    <a class="brand" routerLink="/mi-estadia" aria-label="Hotel Demo, área de cliente">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Hotel Demo</span>
      <span class="brand-tag">Área de cliente</span>
    </a>

    <nav class="cliente-nav" aria-label="Área de cliente">
      @for (item of menu; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="cliente-account">
      <span class="rol-chip">{{ rol() === 'CLIENTE' ? 'Cliente' : (rol() || 'Cliente') }}</span>
      @if (persona(); as p) {
        <span class="nombre">{{ p.nombre }} {{ p.apellido }}</span>
      }
      <button class="btn btn-link" type="button" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="cliente-content">
    <router-outlet></router-outlet>
  </main>

  <app-toast></app-toast>
</div>
