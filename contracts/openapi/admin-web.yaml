                  bootstrapComplete: true
                  degraded: false
                  updatedAt: 2026-10-04T15:00:00Z
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdPath:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    IdHotelQuery:
      name: idHotel
      in: query
      required: true
      schema: {type: integer, minimum: 1}
    Inicio:
      name: inicio
      in: query
      required: true
      schema: {type: string, format: date-time}
    Fin:
      name: fin
      in: query
      required: true
      schema: {type: string, format: date-time}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: 400 validación/formato
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: 401 no autenticado/expirado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: 403 rol insuficiente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: 404 inexistente o ajeno a sede/propietario
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: 409 regla de negocio/duplicado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    PreconditionRequired:
      description: 428 falta If-Match
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    PreconditionFailed:
      description: 412 versión distinta
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    RateLimited:
      description: 429 límite
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    AcceptedOp:
      description: 202 operación en curso (polling Location + Retry-After)
      headers:
        Location:
          schema: {type: string}
        Retry-After:
          schema: {type: integer, example: 2}
      content:
        application/json:
          schema:
            type: object
    Unavailable:
      description: 503 dependencia no disponible
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        data: {type: 'null'}
        error:
          type: object
          required: [code, fields]
          properties:
            code: {type: string}
            fields: {type: object}
        meta:
          type: object
          properties:
            correlationId: {type: string, format: uuid}
    ApiNull:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {type: 'null'}
        meta: {type: object}
    Login:
      type: object
      required: [correo, clave]
      properties:
        correo: {type: string, format: email}
        clave: {type: string, minLength: 1}
    Registro:
      type: object
      required: [tipoDocumento, documento, nombre, apellido, correo, clave]
      properties:
        tipoDocumento: {type: string, enum: [DNI, PASAPORTE, CE]}
        documento: {type: string}
        nombre: {type: string}
        apellido: {type: string}
        correo: {type: string, format: email}
        clave: {type: string, minLength: 12, maxLength: 72}
    PersonaAlta:
      type: object
      required: [tipoDocumento, documento, nombre, apellido, correo]
      properties:
        tipoDocumento: {type: string, enum: [DNI, PASAPORTE, CE]}
        documento: {type: string}
        nombre: {type: string}
        apellido: {type: string}
        correo: {type: string, format: email}
        clave: {type: string}
        idTipoPersona: {type: integer}
        sedes: {type: array, items: {type: integer}}
