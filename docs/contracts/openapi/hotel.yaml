          type: [object, 'null']
          description: >-
            Proyección informativa de ocupación (reception.recepcion.v1); puede ser
            DESCONOCIDA hasta el bootstrap y nunca se convierte a disponible.
          required: [estadoEstadia, idRecepcion, updatedAt]
          properties:
            estadoEstadia:
              type: string
              enum: [LIBRE, OCUPADA, DESCONOCIDA]
              example: LIBRE
            idRecepcion:
              type: [integer, 'null']
              minimum: 1
              example: null
            updatedAt:
              type: string
              format: date-time
              example: '2026-10-12T15:00:00Z'
        blockId:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: >-
            Operación vigente MANTENIMIENTO/BAJA mientras no se libere; la baja
            conserva blockId hasta la reactivación. null si no hay operación.
          example: null
        endpoint:
          type: [string, 'null']
          readOnly: true
          description: >-
            Ruta relativa de polling de la operación vigente
            (GET /api/habitacion/operaciones/{blockId}); null si no hay operación.
          example: /api/habitacion/operaciones/33333333-3333-4333-8333-333333333333
        version:
          type: integer
          minimum: 1
          example: 1
