  /internal/hoteles/{id}:
    get:
      tags: [interno]
      summary: Sede interna para validar sedes
      operationId: hotelInterno
      security:
        - machineToken: [hoteles:read]
      description: >-
        Máquina con scope hoteles:read (identity e inventory). Valida que una sede
        exista y esté activa antes de asignar personas o productos; nunca asignación
        optimista con hotel caído (el caller responde 503). No entra por Gateway.
