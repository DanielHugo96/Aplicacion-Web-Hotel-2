  /api/habitacion/eliminar/{id}:
    delete:
      tags: [habitaciones]
      summary: Baja de habitación (A, V; puede 202 con blockId)
      operationId: eliminarHabitacion
      description: >-
        Solo A con If-Match e Idempotency-Key. V valida la versión antes de crear
        la operación y se revalida al aplicar el cambio local. Semántica:
        200 = reception admitió el bloqueo (gate BLOQUEADA) y hotel aplicó el
        cambio local (CAS PREPARANDO → APLICADA) dentro del request; respuesta
        terminal con Habitacion y blockId.
        202 = la operación quedó persistida PREPARANDO porque la admisión no se
        confirmó en el request (timeout, 503, ROOM_NOT_SYNCED); no significa
        “habitación bloqueada”: hacer polling con Location/Retry-After en
        GET /api/habitacion/operaciones/{blockId}.
        409 = reception rechazó por gate OCUPADA/LIMPIEZA_PENDIENTE: rechazo
        durable por blockId, no se admite después aunque la habitación quede libre;
        otra intención usa otro blockId. El número es reutilizable tras la baja y
        el histórico se identifica por idHabitacion.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Baja aplicada en el request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleHabitacion'
              example:
                success: true
                message: OK
                data:
                  idHabitacion: 101
                  idHotel: 1
                  numero: '101'
                  idPiso: 11
                  pisoNombre: Primer piso
                  idCategoria: 1
                  categoriaNombre: Individual
                  detalle: Habitación individual de demostración
                  precio: 70.00
                  publicada: false
                  estado: false
                  idEstadoHabitacion: 3
                  estadoFisico:
                    idEstadoHabitacion: 3
                    codigo: MANTENIMIENTO
                    descripcion: Mantenimiento
                    estado: true
                    version: 1
                  ocupacion:
                    estadoEstadia: LIBRE
                    idRecepcion: null
                    updatedAt: '2026-10-12T16:00:00Z'
                  blockId: 33333333-3333-4333-8333-333333333333
                  endpoint: /api/habitacion/operaciones/33333333-3333-4333-8333-333333333333
                  version: 2
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '202':
          $ref: '#/components/responses/AcceptedOp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
