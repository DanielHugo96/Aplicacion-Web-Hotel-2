        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: HotelInterno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleHotelInterno'
              example:
                success: true
                message: OK
                data:
                  idHotel: 1
                  nombre: Hotel Demo Lima Centro
                  estado: true
                  version: 1
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT RS256 de usuario humano (iss=hotel-identity, aud=hotel-api, TTL 15 min).
        Claims sub=idPersona, roles y sedes; A global, E solo sedes asignadas.
    machineToken:
      type: oauth2
      description: >-
        Token máquina por client_credentials obtenido en POST /internal/auth/token
        con Basic clientId:secret. Solo para /internal/**; un token humano no basta.
      flows:
        clientCredentials:
          tokenUrl: /internal/auth/token
          scopes:
            habitaciones:read: Leer habitación interna para admisión de operaciones y check-in (reception).
            hoteles:read: Leer sede interna para validar sedes activas (identity e inventory).
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Página 0-based; orden estable por ID ascendente.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Tamaño de página (máximo 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 101
    IdHotelQuery:
      name: idHotel
      in: query
      required: true
      description: H — obligatorio en listados por sede; E solo sedes asignadas.
      schema:
        type: integer
        minimum: 1
      example: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID por intención; mismo valor al reintentar (retención ≥ 30 días).
      schema:
        type: string
        format: uuid
      example: 22222222-2222-4222-8222-222222222222
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión vigente "<version>"; sin él 428, distinta 412.
      schema:
        type: string
        example: '"1"'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: UUID opcional; el Gateway lo genera si falta y lo propaga/responde.
      schema:
        type: string
        format: uuid
      example: 11111111-1111-4111-8111-111111111111
    EstadoQuery:
      name: estado
      in: query
      required: false
      description: Filtro de maestros por estado (activo/inactivo); default true.
      schema:
        type: boolean
        default: true
      example: true
    SlugPath:
      name: slug
      in: path
      required: true
      description: Slug lowercase de la sede.
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        maxLength: 80
      example: lima-centro
  headers:
    CacheControl:
      description: Caché pública de la landing (60 segundos).
      schema:
        type: string
        example: public,max-age=60
  responses:
    BadRequest:
      description: 400 validación/formato; error.fields mapea campo → motivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Revisa los datos marcados.
            data: null
            error:
              code: VALIDATION_ERROR
              fields:
                precio: debe ser mayor que 0 y múltiplo de 0.01
                urlsImagenes: máximo 10 imágenes con URL https allowlist o /assets/
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: 401 no autenticado, token ausente/expirado o firma/issuer inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Tu sesión expiró. Vuelve a iniciar sesión.
            data: null
            error:
              code: UNAUTHENTICATED
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: 403 rol, scope o sede insuficientes (deny-by-default)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: No tienes permiso para esta acción.
            data: null
            error:
              code: FORBIDDEN
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: 404 inexistente o ajeno a sede (anti-enumeración)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: No encontramos lo que buscas.
            data: null
            error:
              code: RESOURCE_NOT_FOUND
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: 409 regla de negocio o duplicado (DUPLICATE_RESOURCE, IDEMPOTENCY_CONFLICT)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Ese valor ya está registrado.
            data: null
            error:
              code: DUPLICATE_RESOURCE
              fields:
                numero: ya existe una habitación activa 101 en la sede 1
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    RoomOperationConflict:
      description: >-
        409 de habitación: rechazo durable del gate (ROOM_OCCUPIED, ROOM_NOT_READY,
        GATE_NOT_AVAILABLE) u operación vigente sin liberar
        (ROOM_OPERATION_IN_PROGRESS). El rechazo por blockId no se admite después
        aunque la habitación quede libre; otra intención usa otro blockId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'No se puede bloquear la habitación: está ocupada o en limpieza.'
            data: null
            error:
              code: GATE_NOT_AVAILABLE
              fields:
                idHabitacion: gate OCUPADA
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    ActiveDependencies:
      description: 409 baja lógica con habitaciones activas o elementos hijos activos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: No se puede dar de baja mientras tenga elementos activos.
            data: null
            error:
              code: ACTIVE_DEPENDENCIES
              fields:
                idHotel: aún tiene habitaciones activas
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    FixedStateCatalog:
      description: 409 catálogo fijo; los estados físicos no se crean ni eliminan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Los estados físicos del sistema no se crean ni eliminan.
            data: null
            error:
              code: FIXED_STATE_CATALOG
              fields:
                ruta: /api/estadohabitacion
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    PreconditionFailed:
      description: 412 versión distinta al ETag vigente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Otra persona modificó este registro. Recarga para ver los cambios.
            data: null
            error:
              code: PRECONDITION_FAILED
              fields:
                If-Match: la versión enviada no es la vigente
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    PreconditionRequired:
      description: 428 falta If-Match en PUT/DELETE con V
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Falta la versión del registro.
            data: null
            error:
              code: PRECONDITION_REQUIRED
              fields:
                If-Match: obligatorio
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    RateLimited:
      description: 429 límite del Gateway (60/min por IP en rutas públicas)
      headers:
        Retry-After:
          description: Segundos antes de reintentar.
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Demasiados intentos. Espera un momento.
            data: null
            error:
              code: RATE_LIMITED
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: 503 dependencia no disponible (servicio de destino caído o circuit breaker abierto)
      headers:
        Retry-After:
          description: Segundos antes de reintentar (misma Idempotency-Key si aplica).
          schema:
            type: integer
            example: 5
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: El servicio no está disponible. Reintenta en unos segundos.
            data: null
            error:
              code: DEPENDENCY_UNAVAILABLE
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    AcceptedOp:
      description: >-
        202 operación persistida PREPARANDO: no significa “habitación bloqueada”.
        Hacer polling en Location con Retry-After; el job reintenta con el mismo
        blockId.
      headers:
        Location:
          description: Ruta de consulta de la operación.
          schema:
            type: string
            example: /api/habitacion/operaciones/33333333-3333-4333-8333-333333333333
        Retry-After:
          description: Segundos antes del siguiente polling.
          schema:
            type: integer
            example: 2
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSingleOperacionRef'
          example:
            success: true
            message: Operación en curso
            data:
              blockId: 33333333-3333-4333-8333-333333333333
              idHabitacion: 101
              tipo: MANTENIMIENTO
              estado: PREPARANDO
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
