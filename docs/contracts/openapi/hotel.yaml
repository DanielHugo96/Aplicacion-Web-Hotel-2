openapi: 3.1.0
info:
  title: Hotel — contrato de servicio
  version: 1.0.0
  description: >-
    Servicio hotel: catálogo público, sedes, pisos, categorías, habitaciones,
    estado físico y limpieza. Base externa vía Gateway http://localhost:8080
    (HTTPS en despliegue); las rutas /internal/** no entran por Gateway y solo se
    exponen en red privada con token máquina. Fuentes:
    docs/especificacion/microservicios/hotel/api.md y base-de-datos.md,
    docs/especificacion/03-contrato-comun.md, docs/contracts/errors.md y
    docs/contracts/openapi/public-web.yaml. Toda respuesta de negocio usa el
    envelope {success,message,data,meta}. Roles: A global; E solo sedes asignadas;
    C nunca usa APIs privadas de habitación. Las públicas son solo lectura con
    Cache-Control: public,max-age=60.
servers:
  - url: http://localhost:8080
    description: API Gateway local
tags:
  - name: publico
    description: Catálogo público de sedes y categorías (sin token)
  - name: sedes
    description: Sedes (A muta; A/E lee su alcance)
  - name: pisos
    description: Pisos por sede
  - name: categorias
    description: Categorías globales
  - name: habitaciones
    description: Habitaciones, físico, operaciones administrativas y limpieza
  - name: estados
    description: Estados físicos fijos del catálogo
  - name: interno
    description: Rutas /internal/** para servicios (token máquina por scopes)
security:
  - bearerAuth: []
paths:
  /api/public/hoteles:
    get:
      tags: [publico]
      summary: Listar sedes publicadas
      operationId: listarHotelesPublicos
      security: []
      description: >-
        Público sin token. Solo sedes publicadas y activas; Cache-Control
        public,max-age=60. Prohibido exponer huéspedes, números de habitación,
        ocupación, stock, ingresos o disponibilidad reservable.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista pública de sedes
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListHotelPublico'
              example:
                success: true
                message: OK
                data:
                  - idHotel: 1
                    slug: lima-centro
                    nombre: Hotel Demo Lima Centro
                    descripcion: Sede de demostración
                    direccion: Dirección de demostración
                    ciudad: Lima
                    telefono: '+51 900 000 001'
                    correoContacto: contacto@hotel.test
                meta:
                  page: 0
                  size: 20
                  totalElements: 3
                  correlationId: 11111111-1111-4111-8111-111111111111
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/public/hoteles/{slug}:
    get:
      tags: [publico]
      summary: Detalle público de sede
      operationId: detalleHotelPublico
      security: []
      description: >-
        Público sin token. Sede inactiva u oculta → 404 para no enumerar. No
        incluye fechas ni parámetro “disponible”; la tarifa de la landing es
        informativa y no constituye reserva.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: HotelPublico
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleHotelPublico'
              example:
                success: true
                message: OK
                data:
                  idHotel: 1
                  slug: lima-centro
                  nombre: Hotel Demo Lima Centro
                  descripcion: Sede de demostración
                  direccion: Dirección de demostración
                  ciudad: Lima
                  telefono: '+51 900 000 001'
                  correoContacto: contacto@hotel.test
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/public/hoteles/{slug}/categorias:
    get:
      tags: [publico]
      summary: Tipos de habitación por sede
      operationId: listarCategoriasPublicas
      security: []
      description: >-
        Público sin token. Solo categorías con habitaciones publicadas y activas;
        precioDesde es el mínimo publicado y la galería es curada (nunca ocupación
        ni datos operativos). capacidad filtra 1..10. Cache-Control
        public,max-age=60.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: capacidad
          in: query
          required: false
          description: Filtro por capacidad exacta de la categoría (1..10).
          schema:
            type: integer
            minimum: 1
            maximum: 10
          example: 1
      responses:
        '200':
          description: Categorías públicas de la sede
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListCategoriaPublica'
              example:
                success: true
                message: OK
                data:
                  - idCategoria: 1
                    descripcion: Individual
                    detalle: Habitación individual de demostración
                    capacidad: 1
                    precioDesde: 70.00
                    moneda: PEN
                    imagenes:
                      - url: /assets/demo/hab-101-1.jpg
                        alt: Habitación de demostración
                meta:
                  page: 0
                  size: 20
                  totalElements: 2
                  correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/public/hoteles/{slug}/categorias/{idCategoria}:
    get:
      tags: [publico]
      summary: Detalle de tipo/categoría
      operationId: detalleCategoriaPublica
      security: []
      description: >-
        Público sin token. Categoría sin habitaciones publicadas en la sede → 404.
        precioDesde se calcula con fn_catalogo_publico (mínimo de habitaciones
        publicadas/activas); moneda fija PEN. Cache-Control public,max-age=60.
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - name: idCategoria
          in: path
          required: true
          description: Categoría global.
          schema:
            type: integer
            minimum: 1
          example: 2
      responses:
        '200':
          description: CategoriaPublica con precioDesde y galería curada
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleCategoriaPublica'
              example:
                success: true
                message: OK
                data:
                  idCategoria: 2
                  descripcion: Doble
                  detalle: Habitación doble de demostración
                  capacidad: 2
                  precioDesde: 100.00
                  moneda: PEN
                  imagenes:
                    - url: /assets/demo/hab-102-1.jpg
                      alt: Habitación de demostración
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/hotel/listar:
    get:
      tags: [sedes]
      summary: Listar sedes de alcance (A/E)
      operationId: listarHoteles
      description: >-
        A todas las sedes; E solo las sedes asignadas en su JWT (nunca por filtro
        de UI). Orden estable por idHotel ascendente. Las listas de maestros
        aceptan ?estado= (default true).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/EstadoQuery'
      responses:
        '200':
          description: Hotel[] del alcance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListHotel'
              example:
                success: true
                message: OK
                data:
                  - idHotel: 1
                    slug: lima-centro
                    nombre: Hotel Demo Lima Centro
                    descripcion: Sede de demostración
                    direccion: Dirección de demostración
                    ciudad: Lima
                    telefono: '+51 900 000 001'
                    correoContacto: contacto@hotel.test
                    estado: true
                    publicado: true
                    version: 1
                  - idHotel: 2
                    slug: miraflores
                    nombre: Hotel Demo Miraflores
                    descripcion: Sede de demostración
                    direccion: Dirección de demostración
                    ciudad: Lima
                    telefono: '+51 900 000 001'
                    correoContacto: contacto@hotel.test
                    estado: true
                    publicado: true
                    version: 1
                  - idHotel: 3
                    slug: arequipa
                    nombre: Hotel Demo Arequipa
                    descripcion: Sede de demostración
                    direccion: Dirección de demostración
                    ciudad: Arequipa
                    telefono: '+51 900 000 001'
                    correoContacto: contacto@hotel.test
                    estado: true
                    publicado: true
                    version: 1
                meta:
                  page: 0
                  size: 20
                  totalElements: 3
                  correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hotel/buscar/{id}:
    get:
      tags: [sedes]
      summary: Buscar sede (A/E)
      operationId: buscarHotel
      description: >-
        A/E. Para E la sede debe pertenecer a sus sedes asignadas; una sede ajena
        responde 404 (anti-enumeración). Devuelve el ETag/version para el If-Match
        de las mutaciones.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Hotel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleHotel'
              example:
                success: true
                message: OK
                data:
                  idHotel: 1
                  slug: lima-centro
                  nombre: Hotel Demo Lima Centro
                  descripcion: Sede de demostración
                  direccion: Dirección de demostración
                  ciudad: Lima
                  telefono: '+51 900 000 001'
                  correoContacto: contacto@hotel.test
                  estado: true
                  publicado: true
                  version: 1
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hotel/registrar:
    post:
      tags: [sedes]
      summary: Crear sede (A)
      operationId: registrarHotel
      description: >-
        Solo A con Idempotency-Key. slug lowercase [a-z0-9-] único (≤ 80) y estable
        tras la publicación; 409 DUPLICATE_RESOURCE si ya existe. Límites comunes:
        descripcion ≤ 300, telefono ≤ 20, correoContacto ≤ 254. Emite SedeSnapshot
        (hotel.sede.v1) con outbox en la misma transacción.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
            example:
              slug: lima-norte
              nombre: Hotel Demo Lima Norte
              descripcion: Sede de demostración
              direccion: Dirección de demostración
              ciudad: Lima
              telefono: '+51 900 000 001'
              correoContacto: contacto@hotel.test
              publicado: false
              estado: true
      responses:
        '201':
          description: Sede creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleHotel'
              example:
                success: true
                message: OK
                data:
                  idHotel: 4
                  slug: lima-norte
                  nombre: Hotel Demo Lima Norte
                  descripcion: Sede de demostración
                  direccion: Dirección de demostración
                  ciudad: Lima
                  telefono: '+51 900 000 001'
                  correoContacto: contacto@hotel.test
                  estado: true
                  publicado: false
                  version: 1
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hotel/actualizar/{id}:
    put:
      tags: [sedes]
      summary: Actualizar sede (A, V)
      operationId: actualizarHotel
      description: >-
        Solo A con If-Match e Idempotency-Key. PUT estado=false aplica la misma
        regla que DELETE: sp_hotel_desactivar solo si no quedan habitaciones
        activas (409 ACTIVE_DEPENDENCIES); tampoco una categoría o piso se inactiva
        si tiene habitaciones activas. slug estable tras publicación.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
            example:
              slug: lima-centro
              nombre: Hotel Demo Lima Centro
              descripcion: Sede de demostración actualizada
              direccion: Dirección de demostración
              ciudad: Lima
              telefono: '+51 900 000 001'
              correoContacto: contacto@hotel.test
              publicado: true
              estado: true
      responses:
        '200':
          description: Sede actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleHotel'
              example:
                success: true
                message: OK
                data:
                  idHotel: 1
                  slug: lima-centro
                  nombre: Hotel Demo Lima Centro
                  descripcion: Sede de demostración actualizada
                  direccion: Dirección de demostración
                  ciudad: Lima
                  telefono: '+51 900 000 001'
                  correoContacto: contacto@hotel.test
                  estado: true
                  publicado: true
                  version: 2
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ActiveDependencies'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/hotel/eliminar/{id}:
    delete:
      tags: [sedes]
      summary: Baja lógica de sede (A, V)
      operationId: eliminarHotel
      description: >-
        Solo A con If-Match e Idempotency-Key. Baja lógica solo si no quedan
        habitaciones activas (409 ACTIVE_DEPENDENCIES) y sin comprobar
        dependencias fuera de la transacción de lock hotel → categoria → piso.
        DELETE repetido con la misma clave devuelve el resultado original.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sede inactiva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleHotel'
              example:
                success: true
                message: OK
                data:
                  idHotel: 3
                  slug: arequipa
                  nombre: Hotel Demo Arequipa
                  descripcion: Sede de demostración
                  direccion: Dirección de demostración
                  ciudad: Arequipa
                  telefono: '+51 900 000 001'
                  correoContacto: contacto@hotel.test
                  estado: false
                  publicado: true
                  version: 2
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ActiveDependencies'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/piso/listar:
    get:
      tags: [pisos]
      summary: Listar pisos por sede (A/E)
      operationId: listarPisos
      description: >-
        H: idHotel es obligatorio y E solo puede consultar una sede asignada
        (ajena → 404). Orden estable por idPiso; ?estado= filtra maestros
        (default true).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/EstadoQuery'
      responses:
        '200':
          description: Piso[] de la sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListPiso'
              example:
                success: true
                message: OK
                data:
                  - idPiso: 11
                    idHotel: 1
                    descripcion: Primer piso
                    estado: true
                    version: 1
                meta:
                  page: 0
                  size: 20
                  totalElements: 1
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/piso/buscar/{id}:
    get:
      tags: [pisos]
      summary: Buscar piso (A/E)
      operationId: buscarPiso
      description: >-
        A/E. La sede se deriva de BD y se valida contra el alcance del usuario;
        piso de sede ajena → 404.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Piso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSinglePiso'
              example:
                success: true
                message: OK
                data:
                  idPiso: 11
                  idHotel: 1
                  descripcion: Primer piso
                  estado: true
                  version: 1
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/piso/registrar:
    post:
      tags: [pisos]
      summary: Crear piso (A)
      operationId: registrarPiso
      description: >-
        Solo A con Idempotency-Key. descripcion ≤ 80 y UNIQUE(id_hotel,descripcion);
        409 DUPLICATE_RESOURCE si se repite en la sede. La sede debe existir.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PisoInput'
            example:
              idHotel: 1
              descripcion: Segundo piso
      responses:
        '201':
          description: Piso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSinglePiso'
              example:
                success: true
                message: OK
                data:
                  idPiso: 12
                  idHotel: 1
                  descripcion: Segundo piso
                  estado: true
                  version: 1
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/piso/actualizar/{id}:
    put:
      tags: [pisos]
      summary: Actualizar piso (A, V)
      operationId: actualizarPiso
      description: >-
        Solo A con If-Match e Idempotency-Key. Solo descripcion y estado: la sede
        de un piso no cambia por PUT. No se inactiva el piso si tiene habitaciones
        activas (409 ACTIVE_DEPENDENCIES); 409 DUPLICATE_RESOURCE si la nueva
        descripcion se repite en la sede.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [descripcion, estado]
              properties:
                descripcion:
                  type: string
                  minLength: 1
                  maxLength: 80
                estado:
                  type: boolean
            example:
              descripcion: Primer piso
              estado: true
      responses:
        '200':
          description: Piso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSinglePiso'
              example:
                success: true
                message: OK
                data:
                  idPiso: 11
                  idHotel: 1
                  descripcion: Primer piso
                  estado: true
                  version: 2
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/piso/eliminar/{id}:
    delete:
      tags: [pisos]
      summary: Baja lógica de piso (A, V)
      operationId: eliminarPiso
      description: >-
        Solo A con If-Match e Idempotency-Key. Baja lógica solo sin habitaciones
        activas en el piso: 409 ACTIVE_DEPENDENCIES en caso contrario, verificando
        dependencias dentro del lock y no antes.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Piso inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSinglePiso'
              example:
                success: true
                message: OK
                data:
                  idPiso: 11
                  idHotel: 1
                  descripcion: Primer piso
                  estado: false
                  version: 2
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ActiveDependencies'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/categoria/listar:
    get:
      tags: [categorias]
      summary: Listar categorías globales (A/E)
      operationId: listarCategorias
      description: >-
        A/E. Categorías globales (no por sede), orden estable por idCategoria;
        ?estado= filtra maestros (default true).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/EstadoQuery'
      responses:
        '200':
          description: Categoria[] global
          content:
            application/json:
