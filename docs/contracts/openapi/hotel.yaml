          type: boolean
          description: Activo/inactivo del catálogo; no es ocupación.
          example: true
        idEstadoHabitacion:
          type: integer
          minimum: 1
          description: 1 LISTA, 2 EN_LIMPIEZA, 3 MANTENIMIENTO.
          example: 1
