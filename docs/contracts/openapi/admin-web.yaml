openapi: 3.1.0
info:
  title: Hotel admin-web — contrato panel con backend
  version: 1.1.0
  description: >-
    Panel privado vía Gateway (http://localhost:8080). Roles ADMIN/EMPLEADO/CLIENTE
    por JWT (iss=hotel-identity, aud=hotel-api, TTL 15min). Deny-by-default.
    POST/PUT/DELETE de negocio exigen Idempotency-Key; PUT/DELETE con V exigen
    If-Match. L=page/size, H=idHotel, V=versión. CLIENTE nunca llama /api/producto/**
    directo (usa /api/venta/catalogo). Catálogo único de errores (error.code,
    mensaje para UI y acción esperada) en docs/contracts/errors.md. La UI presenta
    formatos es-PE: montos S/ 1,234.50 y fechas dd/MM/yyyy HH:mm. En cobros,
    montoRecibido es el pago manual recibido AHORA (incluye el consumo pendiente;
    no es el total histórico) y medioPago es obligatorio. POST
    /api/recepcion/{id}/anular-checkin corrige un check-in errado sin cobro. Las
    bajas/bloqueos de habitación responden 200 cuando el bloqueo se admite y el
    cambio local se aplica en el request, y 202 cuando la operación queda
    PREPARANDO para polling. Fuentes: 02-landing-y-panel.md, 03-contrato-comun.md,
    microservicios/*/api.md y base-de-datos.md, contracts/errors.md,
    gateway-eureka-docker.md.
servers:
  - url: http://localhost:8080
    description: API Gateway local
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: personas
  - name: hoteles
  - name: recepcion
  - name: productos
  - name: ventas
  - name: reportes
paths:
  # ---------- AUTH / PERSONAS (identity) ----------
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Auth legacy con token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/registro:
    post:
      tags: [auth]
      summary: Registro público (fuerza CLIENTE)
      security: []
      operationId: registroPublico
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
      responses:
        '201':
          description: Persona creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPersona'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/me:
    get:
      tags: [auth]
      summary: Sesión propia
      operationId: me
      responses:
        '200':
          description: Persona propia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPersona'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [auth]
      summary: Editar perfil propio (V)
      operationId: actualizarPerfil
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Perfil'
      responses:
        '200':
          description: Persona actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPersona'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/auth/password:
    put:
      tags: [auth]
      summary: Cambiar contraseña
      description: >-
        Verifica la contraseña vigente con BCrypt. El body contiene credenciales:
        el request_hash de idempotencia se calcula con HMAC y la clave nunca se
        guarda en payloads de idempotencia; un reintento devuelve el resultado
        terminal original.
      operationId: cambiarPassword
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: OK data=null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNull'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/social:
    post:
      tags: [auth]
      summary: RETIRADA — no usar
      security: []
      operationId: socialRetirada
      responses:
        '410':
          description: SOCIAL_LOGIN_DISABLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/persona/listar:
    get:
      tags: [personas]
      summary: Listar personas (A/E; E solo CLIENTE con documento exacto)
      operationId: listarPersonas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: idTipoPersona
          in: query
          required: false
          schema: {type: integer, minimum: 1}
        - name: documento
          in: query
          required: false
          description: Obligatorio para EMPLEADO (búsqueda exacta)
          schema: {type: string, maxLength: 20}
      responses:
        '200':
          description: Persona[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListPersona'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/persona/buscar/{id}:
    get:
      tags: [personas]
      summary: Buscar persona (C solo propia)
      operationId: buscarPersona
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPersona'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/persona/registrar:
    post:
      tags: [personas]
      summary: Alta persona (A/E; E solo CLIENTE)
      operationId: registrarPersona
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaAlta'
      responses:
        '201':
          description: Persona creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPersona'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/persona/actualizar/{id}:
    put:
      tags: [personas]
      summary: Actualizar persona (A, V; protege último ADMIN)
      operationId: actualizarPersona
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaUpdate'
      responses:
        '200':
          description: Persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPersona'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/persona/eliminar/{id}:
    delete:
      tags: [personas]
      summary: Baja lógica (A, V; no último ADMIN)
      operationId: eliminarPersona
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Persona inactiva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPersona'
  /api/tipopersona/listar:
    get:
      tags: [personas]
      summary: Listar tipos (A/E)
      operationId: listarTipos
      responses:
        '200':
          description: TipoPersona[] (catálogo fijo ADMIN/EMPLEADO/CLIENTE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListTipoPersona'
  /api/tipopersona/buscar/{id}:
    get:
      tags: [personas]
      summary: Buscar tipo (A/E)
      operationId: buscarTipo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: TipoPersona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTipoPersona'
  /api/tipopersona/actualizar/{id}:
    put:
      tags: [personas]
      summary: Editar etiqueta (A, V; código inmutable)
      operationId: actualizarTipo
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [descripcion]
              properties:
                descripcion: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: TipoPersona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTipoPersona'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------- HOTEL ----------
  /api/hotel/listar:
    get:
      tags: [hoteles]
      summary: Listar sedes de alcance (A/E)
      operationId: listarHoteles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Hotel[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListHotel'
  /api/hotel/buscar/{id}:
    get:
      tags: [hoteles]
      summary: Buscar sede (A/E)
      operationId: buscarHotel
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Hotel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHotel'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/hotel/registrar:
    post:
      tags: [hoteles]
      summary: Crear sede (A)
      operationId: registrarHotel
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
      responses:
        '201':
          description: Hotel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHotel'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hotel/actualizar/{id}:
    put:
      tags: [hoteles]
      summary: Actualizar sede (A, V)
      operationId: actualizarHotel
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
      responses:
        '200':
          description: Hotel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHotel'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/hotel/eliminar/{id}:
    delete:
      tags: [hoteles]
      summary: Baja sede (A, V; 409 si habitaciones activas)
      operationId: eliminarHotel
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Baja lógica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHotel'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/piso/listar:
    get:
      tags: [hoteles]
      summary: Listar pisos por sede (A/E)
      operationId: listarPisos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/IdHotelQuery'
      responses:
        '200':
          description: Piso[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListPiso'
  /api/piso/buscar/{id}:
    get:
      tags: [hoteles]
      summary: Buscar piso
      operationId: buscarPiso
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Piso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPiso'
  /api/piso/registrar:
    post:
      tags: [hoteles]
      summary: Crear piso (A)
      operationId: registrarPiso
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idHotel, descripcion]
              properties:
                idHotel: {type: integer, minimum: 1}
                descripcion: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Piso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPiso'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/piso/actualizar/{id}:
    put:
      tags: [hoteles]
      summary: Actualizar piso (A, V)
      operationId: actualizarPiso
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [descripcion, estado]
              properties:
                descripcion: {type: string, minLength: 1, maxLength: 80}
                estado: {type: boolean}
      responses:
        '200':
          description: Piso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPiso'
  /api/piso/eliminar/{id}:
    delete:
      tags: [hoteles]
      summary: Baja piso (A, V)
      operationId: eliminarPiso
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPiso'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/categoria/listar:
    get:
      tags: [hoteles]
      summary: Listar categorías (A/E)
      operationId: listarCategorias
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Categoria[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListCategoria'
  /api/categoria/buscar/{id}:
    get:
      tags: [hoteles]
      summary: Buscar categoría
      operationId: buscarCategoria
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Categoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCategoria'
  /api/categoria/registrar:
    post:
      tags: [hoteles]
      summary: Crear categoría (A)
      operationId: registrarCategoria
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        '201':
          description: Categoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCategoria'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/categoria/actualizar/{id}:
    put:
      tags: [hoteles]
      summary: Actualizar categoría (A, V)
      operationId: actualizarCategoria
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        '200':
          description: Categoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCategoria'
  /api/categoria/eliminar/{id}:
    delete:
      tags: [hoteles]
      summary: Baja categoría (A, V)
      operationId: eliminarCategoria
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCategoria'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/habitacion/listar:
    get:
      tags: [hoteles]
      summary: Listar habitaciones por sede (A/E)
      operationId: listarHabitaciones
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/IdHotelQuery'
        - name: idCategoria
          in: query
          required: false
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Habitacion[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListHabitacion'
  /api/habitacion/buscar/{id}:
    get:
      tags: [hoteles]
      summary: Buscar habitación (A/E)
      operationId: buscarHabitacion
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Habitacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHabitacion'
  /api/habitacion/registrar:
    post:
      tags: [hoteles]
      summary: Crear habitación LISTA (A)
      operationId: registrarHabitacion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitacionInput'
      responses:
        '201':
          description: Habitacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHabitacion'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/habitacion/actualizar/{id}:
    put:
      tags: [hoteles]
      summary: Actualizar catálogo (A, V; no físico/número/sede)
      operationId: actualizarHabitacion
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitacionUpdate'
      responses:
        '200':
          description: Habitacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHabitacion'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/habitacion/eliminar/{id}:
    delete:
      tags: [hoteles]
      summary: Baja habitación (A, V; 200 terminal o 202 PREPARANDO)
      description: >-
        200: reception admitió el bloqueo (gate BLOQUEADA) y hotel aplicó el
        cambio local (CAS PREPARANDO → APLICADA) dentro del request; respuesta
        terminal con Habitacion + blockId. 202: la operación quedó persistida
        PREPARANDO porque la admisión no se confirmó en el request (timeout, 503,
        ROOM_NOT_SYNCED); el cliente consulta GET
        /api/habitacion/operaciones/{blockId} y no debe reintentar la baja. 409:
        reception rechazó por gate OCUPADA/LIMPIEZA_PENDIENTE con rechazo durable
        por blockId; otra intención usa otro blockId.
      operationId: eliminarHabitacion
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: >-
            = admisión del bloqueo y cambio local aplicado en el request;
            respuesta terminal con Habitacion (blockId de la operación vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHabitacion'
        '202':
          $ref: '#/components/responses/AcceptedOp'
        '409':
          description: >-
            Rechazo durable del gate (GATE_NOT_AVAILABLE, ROOM_OPERATION_IN_PROGRESS);
            no se admite después con el mismo blockId aunque la habitación quede libre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/habitacion/{id}/mantenimiento:
    post:
      tags: [hoteles]
      summary: Iniciar mantenimiento (A, V; 200 terminal o 202 PREPARANDO)
      description: >-
        200: reception admitió el bloqueo (gate BLOQUEADA) y hotel aplicó el
        cambio local (CAS PREPARANDO → APLICADA) dentro del request; respuesta
        terminal con Habitacion + blockId. 202: la operación quedó persistida
        PREPARANDO porque la admisión no se confirmó en el request (timeout, 503,
        ROOM_NOT_SYNCED); el cliente consulta GET
        /api/habitacion/operaciones/{blockId}. 409: reception rechazó por gate
        OCUPADA/LIMPIEZA_PENDIENTE con rechazo durable por blockId.
      operationId: iniciarMantenimiento
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motivo]
              properties:
                motivo: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200':
          description: >-
            Admisión del bloqueo y cambio local aplicado en el request
            (Habitacion con blockId de la operación vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHabitacion'
        '202':
          $ref: '#/components/responses/AcceptedOp'
        '409':
          description: >-
            Rechazo durable del gate (GATE_NOT_AVAILABLE, ROOM_OPERATION_IN_PROGRESS);
            no se admite después con el mismo blockId aunque la habitación quede libre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/habitacion/{id}/mantenimiento-completado:
    put:
      tags: [hoteles]
      summary: Completar mantenimiento (A, V)
      operationId: completarMantenimiento
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
