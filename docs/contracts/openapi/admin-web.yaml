  /api/recepcion/registrar-salida:
    post:
      tags: [recepcion]
      summary: Cierre (A/E; 200 cerrada o 202 CERRANDO)
      description: >-
        montoRecibido es el pago manual recibido AHORA (etiqueta de panel “Monto
        recibido ahora”) e incluye el consumo pendiente; no es el total histórico.
        El backend verifica contra el cálculo estable y compara de forma exacta:
        cualquier diferencia, aunque sea 0.01, devuelve 409 AMOUNT_MISMATCH con la
        nueva cotización y el closureId. costoPenalidad 0..precioInicial y si es
        > 0 exige motivoPenalidad 1..300. medioPago es obligatorio en cada cobro.
      operationId: checkout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Salida'
            example:
              idRecepcion: 1001
              idHabitacion: 101
              costoPenalidad: 0.00
              montoRecibido: 57.00
              medioPago: EFECTIVO
      responses:
        '200':
          description: Recepcion CERRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRecepcion'
        '202':
          $ref: '#/components/responses/AcceptedOp'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/recepcion/{id}/anular-checkin:
    post:
      tags: [recepcion]
      summary: Anular check-in errado (A, V; 200 CERRADA archivada)
      description: >-
        Corrige una estadía ACTIVA creada por error. Admisible solo si está
        ACTIVA, sin ventas admitidas ni cierre en curso. Hace CAS ACTIVA →
        CERRADA con archivada=true, libera room_gate a LIBRE con roomVersion++
        (sin limpieza ni notificación de checkout), publica RecepcionActualizada
        y audita en audit_log. No genera receipt ni cobro. Con operaciones
        ABIERTAS responde 409 OPERATIONS_IN_PROGRESS; con cierre vigente 409
        CLOSURE_IN_PROGRESS. Requiere motivo 1..300, If-Match e Idempotency-Key;
        el mismo Idempotency-Key devuelve el resultado terminal.
      operationId: anularCheckin
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motivo]
              properties:
                motivo: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200':
          description: Recepcion CERRADA archivada sin cobro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRecepcion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            OPERATIONS_IN_PROGRESS si hay operaciones de consumo ABIERTAS;
            CLOSURE_IN_PROGRESS si existe cierre vigente; STAY_NOT_ACTIVE si la
            estadía no está ACTIVA. El rechazo no cambia nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/recepcion/eliminar/{id}:
    delete:
      tags: [recepcion]
