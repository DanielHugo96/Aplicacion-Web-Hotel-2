openapi: 3.1.0
info:
  title: Hotel reporting — contrato del microservicio de reportes
  version: 1.0.0
  description: >-
    Rutas de solo lectura invocadas por el frontend vía Gateway
    (http://localhost:8080) con JWT humano (iss=hotel-identity,
    aud=hotel-api, TTL 15min): ADMIN todas las sedes; EMPLEADO solo sedes
    asignadas; CLIENTE prohibido (403 FORBIDDEN). Los datos salen del read
    model de Kafka (consistencia EVENTUAL): el meta expone updatedAt, degraded
    y bootstrapComplete y no promete frescura absoluta. Sin filas → data[] con
    200, nunca 404. Sin bootstrap LISTO → 503 REPORTING_NOT_READY; proyección
    degradada no utilizable (>5min sin conexión activa o DLT sin reparar) →
    503 REPORTING_UNAVAILABLE; degradación parcial → 200 con degraded=true y
    advertencia visible. inicio/fin ISO-8601 con offset, intervalo semiabierto
    [inicio,fin) y máximo 366 días. Sin rutas internas ni scopes de máquina.
    Fuentes: especificacion/microservicios/reporting/api.md,
    especificacion/microservicios/reporting/base-de-datos.md,
    03-contrato-comun.md.
servers:
  - url: http://localhost:8080
    description: API Gateway local
security:
  - bearerAuth: []
tags:
  - name: reportes
    description: Consultas agregadas eventualmente consistentes (sin CLIENTE)
paths:
  /api/reportes/productos-bajo-stock:
    get:
      tags: [reportes]
      summary: Productos bajo stock por sede (A todas; E asignada)
      operationId: reporteProductosBajoStock
      description: >-
        A/E; idHotel obligatorio (E solo sede asignada; sede ajena → 404
        RESOURCE_NOT_FOUND). limite es el umbral de cantidad (se listan
        productos activos con cantidad ≤ limite), no un límite de filas.
        Orden estable por idProducto ascendente; sin filas, data[].
        Estado degradado: 200 con degraded=true y advertencia visible, o 503
        REPORTING_UNAVAILABLE si la proyección no es utilizable.
      parameters:
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: ReporteBajoStock[] con meta de consistencia eventual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReporteListBajoStock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/reportes/ventas:
    get:
      tags: [reportes]
      summary: Ventas pagadas agregadas por producto (A todas; E asignada)
      operationId: reporteVentas
      description: >-
        A/E; idHotel obligatorio. Agrega por producto SOLO las ventas con
        estado PAGADO según paid_at en [inicio, fin): las CONFIRMADA impagas no
        cuentan como ingreso y cada pago se cuenta una sola vez. inicio/fin
        con offset, inicio<fin, máximo 366 días (400 si se excede). Orden por
        clave de agrupación (idProducto); sin filas, data[].
        Estado degradado: 200 con degraded=true y advertencia visible, o 503
        REPORTING_UNAVAILABLE si la proyección no es utilizable.
      parameters:
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/Inicio'
        - $ref: '#/components/parameters/Fin'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: ReporteVentas[] con meta de consistencia eventual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReporteListVentas'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/reportes/ocupacion:
    get:
      tags: [reportes]
      summary: Ocupación por habitación (check-ins por fecha local)
      operationId: reporteOcupacion
      description: >-
        A/E; idHotel obligatorio. Cuenta check-ins por fechaEntrada local y
        acepta únicamente inicio/fin en medianoche America/Lima
        (00:00:00-05:00), para no inventar horas que el monolito no guarda;
        otra hora → 400 VALIDATION_ERROR. Intervalo [inicio, fin). No expone
        porcentaje de ocupación: solo vecesAlquilada (sin denominador no hay
        porcentaje). Orden estable y sin filas, data[].
        Estado degradado: 200 con degraded=true y advertencia visible, o 503
        REPORTING_UNAVAILABLE si la proyección no es utilizable.
      parameters:
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/Inicio'
        - $ref: '#/components/parameters/Fin'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: ReporteOcupacion[] con meta de consistencia eventual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReporteListOcupacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/reportes/cobros:
    get:
      tags: [reportes]
      summary: Cobros de recepciones cerradas (receipt snapshot)
      operationId: reporteCobros
      description: >-
        A/E; idHotel obligatorio. Recepciones CERRADAS por fecha_cierre en
        [inicio, fin); usa el snapshot del receipt y no vuelve a sumar ventas
        (evita doble conteo con el reporte de ventas). medioPagoAdelanto y
        medioPagoCierre vienen del cierre y null = NO_REGISTRADO (histórico
        migrado sin dato); permiten desglosar por medio de pago. Orden por
        fechaCierre, idRecepcion; sin filas, data[].
        Estado degradado: 200 con degraded=true y advertencia visible, o 503
        REPORTING_UNAVAILABLE si la proyección no es utilizable.
      parameters:
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/Inicio'
        - $ref: '#/components/parameters/Fin'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: ReporteCobros[] con meta de consistencia eventual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReporteListCobros'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/reportes/dashboard:
    get:
      tags: [reportes]
      summary: Dashboard del día (A consolidado; E sede asignada)
      operationId: reporteDashboard
      description: >-
        ADMIN puede omitir idHotel para el consolidado de todas las sedes;
        EMPLEADO debe indicar una sede asignada (omitir el filtro no lo
        convierte en lector global; sede ajena → 404 RESOURCE_NOT_FOUND).
        ingresosHoy mide caja del día: adelantos de check-ins de hoy + cobro
        final de ALOJAMIENTO de cierres de hoy + ventas PAGADO con paid_at de
        hoy, cada pago una sola vez; las CONFIRMADA impagas no cuentan y el
        totalGeneral del cierre no se suma otra vez. moneda siempre PEN.
        Estado degradado: 200 con degraded=true y advertencia visible, o 503
        REPORTING_UNAVAILABLE si la proyección no es utilizable.
      parameters:
        - $ref: '#/components/parameters/IdHotelOpcional'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Dashboard de la sede o consolidado, con meta de consistencia eventual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReporteDashboard'
              example:
                success: true
                message: OK
                data:
                  habitacionesOcupadas: 0
                  habitacionesDisponibles: 6
                  productosBajoStock: 3
                  ingresosHoy: 0.00
                  moneda: PEN
                meta:
                  consistency: EVENTUAL
                  bootstrapComplete: true
                  degraded: false
                  updatedAt: '2026-10-04T15:00:00Z'
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT humano de identity (iss=hotel-identity, aud=hotel-api, TTL 15min).
        No existe ruta interna ni scope de máquina en reporting.
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
      description: Página solicitada (0-based).
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: Tamaño de página; máximo 100.
    IdHotelQuery:
      name: idHotel
      in: query
      required: true
      schema: {type: integer, minimum: 1}
      description: >-
        Sede reportada (H); debe pertenecer al alcance del token (A cualquiera,
        E solo asignadas). Sede ajena → 404.
    IdHotelOpcional:
      name: idHotel
      in: query
      required: false
      schema: {type: integer, minimum: 1}
      description: >-
        Opcional solo para ADMIN (consolidado de todas las sedes); EMPLEADO
        debe indicar una sede asignada.
    Limite:
      name: limite
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 5}
      description: >-
        Umbral de stock: se listan productos activos con cantidad ≤ limite;
        no es un límite de filas.
    Inicio:
      name: inicio
      in: query
      required: true
      schema: {type: string, format: date-time}
      description: >-
        ISO-8601 con offset. Intervalo semiabierto [inicio, fin); inicio<fin y
        máximo 366 días (400 si se excede). Ocupación exige medianoche
        America/Lima.
    Fin:
      name: fin
      in: query
      required: true
      schema: {type: string, format: date-time}
      description: Fin exclusivo del intervalo (ISO-8601 con offset).
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: {type: string, format: uuid}
      description: >-
        UUID opcional del cliente; el Gateway lo genera si falta y lo
        propaga/respond en meta.correlationId.
  responses:
    BadRequest:
      description: >-
        400 validación/formato: idHotel ausente, inicio≥fin, intervalo mayor a
        366 días u hora distinta de medianoche en ocupación (VALIDATION_ERROR).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: 401 token ausente, expirado o inválido (UNAUTHENTICATED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: 403 CLIENTE o rol sin acceso a reportes (FORBIDDEN)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: >-
        404 sede ajena al alcance del token o idHotel inexistente
        (RESOURCE_NOT_FOUND; anti-enumeración).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unavailable:
      description: >-
        503 bootstrap no LISTO (REPORTING_NOT_READY) o proyección degradada no
        utilizable, p. ej. >5min sin conexión activa o DLT sin reparar
        (REPORTING_UNAVAILABLE). Nunca promete frescura absoluta.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        data: {type: 'null'}
        error:
          type: object
          required: [code, fields]
          properties:
            code: {type: string}
            fields: {type: object}
        meta: {type: object}
    ApiMetaReporte:
      type: object
      description: >-
        Meta de reportes con consistencia eventual. En listas añade page,
        size y totalElements. updatedAt es el mínimo checkpoint con timestamp
        de ingestión de los topics requeridos (no la hora exacta del dato
        origen) y puede ser null mientras todas las particiones estén vacías.
      required: [consistency, degraded, bootstrapComplete]
      properties:
        updatedAt:
          type: [string, 'null']
          format: date-time
        consistency: {type: string, const: EVENTUAL}
        degraded:
          type: boolean
          description: >-
            true refleja errores/DLT/desconexión conocidos; la UI muestra la
            advertencia aunque la respuesta sea 200.
        bootstrapComplete:
          type: boolean
          description: true = projection_bootstrap en LISTO con manifest cumplido.
        correlationId: {type: string, format: uuid}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
    ReporteBajoStock:
      type: object
      description: Producto activo con cantidad ≤ limite (proyección de stock).
      required: [idProducto, nombreProducto, cantidad, precio, estado]
      properties:
        idProducto: {type: integer, minimum: 1}
        nombreProducto: {type: string, maxLength: 120}
        cantidad: {type: integer, minimum: 0}
        precio: {type: number, multipleOf: 0.01, exclusiveMinimum: 0}
        estado: {type: boolean}
    ReporteVentas:
      type: object
      description: Agregado por producto de ventas PAGADO por paid_at en [inicio, fin).
      required: [idProducto, nombreProducto, cantidadTotal, totalIngresado]
      properties:
        idProducto: {type: integer, minimum: 1}
        nombreProducto: {type: string, maxLength: 120}
        cantidadTotal: {type: integer, minimum: 0}
        totalIngresado: {type: number, multipleOf: 0.01, minimum: 0}
    ReporteOcupacion:
      type: object
      description: Veces que una habitación fue alquilada (check-ins) en el rango de fechas Lima.
      required: [idHabitacion, numeroHabitacion, descripcionCategoria, vecesAlquilada]
      properties:
        idHabitacion: {type: integer, minimum: 1}
        numeroHabitacion: {type: string, maxLength: 10}
        descripcionCategoria: {type: string, maxLength: 80}
        vecesAlquilada: {type: integer, minimum: 0}
    ReporteCobros:
      type: object
      description: Cobro de una recepción CERRADA según el snapshot de su receipt.
      required: [idRecepcion, numeroHabitacion, nombreCliente, totalAlojamiento, totalConsumos, totalGeneral, medioPagoAdelanto, medioPagoCierre, fechaCierre]
      properties:
        idRecepcion: {type: integer, minimum: 1}
        numeroHabitacion: {type: string, maxLength: 10}
        nombreCliente: {type: string, maxLength: 200}
        totalAlojamiento: {type: number, multipleOf: 0.01, minimum: 0}
        totalConsumos: {type: number, multipleOf: 0.01, minimum: 0}
        totalGeneral: {type: number, multipleOf: 0.01, minimum: 0}
        medioPagoAdelanto:
          type: [string, 'null']
          enum: [EFECTIVO, TARJETA, OTRO, null]
          description: null = NO_REGISTRADO (histórico migrado sin dato).
        medioPagoCierre:
          type: [string, 'null']
          enum: [EFECTIVO, TARJETA, OTRO, null]
          description: null = NO_REGISTRADO (histórico migrado sin dato).
        fechaCierre: {type: string, format: date-time}
    Dashboard:
      type: object
      description: Métricas del día; ingresosHoy sin doble conteo del cierre.
      required: [habitacionesOcupadas, habitacionesDisponibles, productosBajoStock, ingresosHoy, moneda]
      properties:
        habitacionesOcupadas: {type: integer, minimum: 0}
        habitacionesDisponibles: {type: integer, minimum: 0}
        productosBajoStock: {type: integer, minimum: 0}
        ingresosHoy: {type: number, multipleOf: 0.01, minimum: 0}
        moneda: {type: string, const: PEN}
    ApiReporteListBajoStock:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data:
          type: array
          items: {$ref: '#/components/schemas/ReporteBajoStock'}
        meta: {$ref: '#/components/schemas/ApiMetaReporte'}
    ApiReporteListVentas:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data:
          type: array
          items: {$ref: '#/components/schemas/ReporteVentas'}
        meta: {$ref: '#/components/schemas/ApiMetaReporte'}
    ApiReporteListOcupacion:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data:
          type: array
          items: {$ref: '#/components/schemas/ReporteOcupacion'}
        meta: {$ref: '#/components/schemas/ApiMetaReporte'}
    ApiReporteListCobros:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data:
          type: array
          items: {$ref: '#/components/schemas/ReporteCobros'}
        meta: {$ref: '#/components/schemas/ApiMetaReporte'}
    ApiReporteDashboard:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/Dashboard'}
        meta: {$ref: '#/components/schemas/ApiMetaReporte'}
