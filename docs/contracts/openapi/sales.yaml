openapi: 3.1.0
info:
  title: Hotel sales — contrato del microservicio de carrito, ventas y cierre de consumos
  version: 1.0.0
  description: >-
    Rutas /api/** invocadas por el frontend vía Gateway
    (http://localhost:8080) con JWT humano (iss=hotel-identity,
    aud=hotel-api, TTL 15min): A/E con alcance de sede, C solo sus
    recepciones y ventas. Las rutas /internal/** no pasan por Gateway: Feign
    las invoca por Eureka con JWT máquina (client_credentials, scope
    cierres:write) y un token de usuario no basta. Idempotency-Key
    obligatoria en POST/PUT/DELETE de negocio; If-Match (V) obligatorio en
    PUT/DELETE de venta: sin header 428 y versión distinta 412. Dinero
    numeric(12,2) con HALF_UP (múltiplos de 0.01); el cliente nunca envía
    precios, totales ni estadoOperacion. Envelope {success,message,data,meta};
    catálogo de errores en ../errors.md. Fuentes:
    especificacion/microservicios/sales/api.md,
    especificacion/microservicios/sales/base-de-datos.md,
    03-contrato-comun.md, 05-mensajeria.md.
servers:
  - url: http://localhost:8080
    description: API Gateway local (rutas /api/**); las rutas /internal/** se resuelven por Eureka entre servicios
security:
  - bearerAuth: []
tags:
  - name: catalogo
    description: Catálogo privado de productos de la sede de la estadía
  - name: carrito
    description: Carrito por recepción (LEGACY con envelope nuevo)
  - name: ventas
    description: Ventas, pago manual, anulación y polling de operaciones
  - name: cierres
    description: Feign entrante de reception; solo token máquina con scope cierres:write
paths:
  # ---------- CATALOGO Y CARRITO ----------
  /api/venta/catalogo:
    get:
      tags: [catalogo]
      summary: Catálogo privado de la sede de la estadía (A/E/C)
      operationId: listarCatalogoVenta
      description: >-
        A/E/C. idRecepcion obligatorio: se deriva su sede y se valida
        propiedad antes de consultar inventory (C solo su estadía; ajena →
        404 RESOURCE_NOT_FOUND). Estadía CERRANDO/CERRADA → 409
        STAY_NOT_ACTIVE. Devuelve solo productos activos de esa sede con el
        precio autoritativo de inventory; si inventory está caído responde
        503 DEPENDENCY_UNAVAILABLE sin fallback de precio inventado.
      parameters:
        - name: idRecepcion
          in: query
          required: true
          schema: {type: integer, minimum: 1}
          description: Estadía cuya sede define el catálogo; C solo la propia.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: CatálogoItem[] de la sede (meta con page, size y totalElements)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListCatalogoItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/carrito/agregar:
    post:
      tags: [carrito]
      summary: Agregar producto al carrito (upsert; suma a la línea existente)
      operationId: agregarCarrito
      description: >-
        A/E/C; sin body, parámetros en query. Siempre suma cantidad a la línea
        actual (1..9999) y el upsert incrementa version. Idempotency-Key
        obligatoria para que un retry no sume dos veces. El cliente no envía
        idPersona ni precio: el precio unitario se obtiene al consultar
        inventory (503 sin él). Estadía CERRANDO/CERRADA → 409
        STAY_NOT_ACTIVE; producto inactivo en la sede → 409 PRODUCT_INACTIVE.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: idRecepcion
          in: query
          required: true
          schema: {type: integer, minimum: 1}
          description: Estadía ACTIVA; C solo la propia.
        - name: idProducto
          in: query
          required: true
          schema: {type: integer, minimum: 1}
        - name: cantidad
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 9999}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: CarritoItem de la línea (creada o incrementada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCarritoItem'
              example:
                success: true
                message: OK
                data:
                  idCarrito: 9001
                  idRecepcion: 1001
                  idPersona: 100
                  idHotel: 1
                  idProducto: 1
                  nombreProducto: Agua 500ml
                  precioUnitario: 3.50
                  imagenUrl: /assets/productos/agua-500.png
                  cantidad: 2
                  fechaRegistro: '2026-10-04T15:00:00Z'
                  version: 2
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/carrito/listar/{idRecepcion}:
    get:
      tags: [carrito]
      summary: Listar el carrito de la estadía (CERRADA → [])
      operationId: listarCarrito
      description: >-
        A/E/C con validación de propiedad (C solo la propia; ajena → 404
        RESOURCE_NOT_FOUND). Si la estadía está CERRADA devuelve [] tras
        validar propiedad; CERRANDO también es solo lectura. Se devuelve el
        carrito completo: meta con page=0 y size=totalElements (lista pequeña,
        sin paginación).
      parameters:
        - name: idRecepcion
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: CarritoItem[] de la estadía (posible [] si está cerrada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListCarritoItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/carrito/eliminar:
    delete:
      tags: [carrito]
      summary: Quitar línea del carrito (204 sin cuerpo)
      operationId: eliminarCarrito
      description: >-
        A/E/C; idRecepcion e idProducto en query. Borra solo la línea (no hay
        stock que restituir). Idempotency-Key obligatoria para que un retry no
        borre dos veces: repetir la misma clave devuelve el mismo 204 sin
        efectos adicionales; misma clave con request distinto → 409
        IDEMPOTENCY_CONFLICT.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: idRecepcion
          in: query
          required: true
          schema: {type: integer, minimum: 1}
        - name: idProducto
          in: query
          required: true
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Línea eliminada; sin cuerpo
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------- VENTAS ----------
  /api/venta:
    get:
      tags: [ventas]
      summary: Listar ventas de la sede (A/E)
      operationId: listarVentas
      description: >-
        A/E. idHotel obligatorio (H) y dentro del alcance del token; E no
        puede listar otra sede. Filtros opcionales por estado de pago y
        estadoOperacion. Orden estable por idVenta ascendente; sin filas,
        data[] con meta de paginación.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/IdHotelQuery'
        - name: estado
          in: query
          required: false
          schema: {type: string, enum: [PENDIENTE, PAGADO]}
        - name: estadoOperacion
          in: query
          required: false
          schema: {type: string, enum: [PENDIENTE, CONFIRMADA, RECHAZADA, CANCELACION_PENDIENTE, CANCELADA]}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Venta[] de la sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListVenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ventas]
      summary: Crear venta (A/E/C; C solo PENDIENTE y sin precios)
      operationId: crearVenta
      description: >-
        A/E/C con Idempotency-Key: dos solicitudes con la misma clave y
        payload crean una sola venta (mismo idVenta); misma clave con payload
        distinto → 409 IDEMPOTENCY_CONFLICT. idHotel e idCliente se derivan de
        la recepción; el body no admite total, precioUnitario, subTotal,
        nombreProducto, estadoOperacion ni idVenta (400 VALIDATION_ERROR).
        Hasta 50 líneas de productos distintos. C solo PENDIENTE u omitido: C
        enviando estado PAGADO → 403 FORBIDDEN (solo A/E registran pago manual
        al crear y allí medioPago es obligatorio). 201 con la venta CONFIRMADA
        (estado PENDIENTE, o PAGADO si A/E registraron el pago) o 202 si la
        operación queda en recuperación con Location (GET buscar) y
        Retry-After 2; un timeout nunca se convierte en venta confirmada. 409
        según caso: STOCK_INSUFFICIENT, STAY_NOT_ACTIVE, PRODUCT_INACTIVE.
        503 si la dependencia cae antes de cualquier operación durable.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VentaAlta'
      responses:
        '201':
          description: Venta CONFIRMADA (débito de stock aplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVenta'
              example:
                success: true
                message: OK
                data:
                  idVenta: 5001
                  idRecepcion: 1001
                  idCliente: 100
                  idHotel: 1
                  total: 7.00
                  estado: PAGADO
                  estadoOperacion: CONFIRMADA
                  operationId: 55555555-5555-4555-8555-555555555555
                  medioPago: EFECTIVO
                  version: 3
                  fechaCreacion: '2026-10-04T15:05:00Z'
                  paidAt: '2026-10-05T16:10:00Z'
                  detalles:
                    - idDetalleVenta: 1
                      idProducto: 1
                      nombreProducto: Agua 500ml
                      cantidad: 2
                      precioUnitario: 3.50
                      subTotal: 7.00
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '202':
          description: >-
            202 operación en recuperación: la venta puede terminar CONFIRMADA
            o RECHAZADA; hacer polling en Location con Retry-After 2. Un 202
            no significa venta confirmada.
          headers:
            Location:
              description: GET /api/venta/buscar/{id} de la venta en curso
              schema: {type: string, example: /api/venta/buscar/5001}
            Retry-After:
              schema: {type: integer, example: 2}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/venta/buscar/{id}:
    get:
      tags: [ventas]
      summary: Buscar venta por id (A/E; C solo propia)
      operationId: buscarVenta
      description: >-
        A/E o C dueño de la venta; venta ajena a la sede o al propietario →
        404 RESOURCE_NOT_FOUND (anti-enumeración). Es el documento vivo del
        polling: los 202 de alta, pago y anulación apuntan aquí vía Location y
        es donde se lee la respuesta terminal persistida.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Venta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVenta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/venta/recepcion/{idRecepcion}:
    get:
      tags: [ventas]
      summary: Listar ventas de una estadía (A/E; C solo propia)
      operationId: ventasPorRecepcion
      description: >-
        A/E de la sede o C dueño de la estadía (ajena → 404
        RESOURCE_NOT_FOUND). Devuelve las ventas propias de la recepción,
        incluidas las canceladas (el historial no desaparece en DELETE).
        Orden estable por idVenta ascendente.
      parameters:
        - name: idRecepcion
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Venta[] de la estadía
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListVenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/venta/{id}:
    put:
      tags: [ventas]
      summary: Registrar pago manual (A/E; If-Match + Idempotency-Key)
      operationId: pagarVenta
      description: >-
        A/E. Registra el pago de una venta CONFIRMADA o PENDIENTE con V
        (If-Match: sin header 428, versión distinta 412). El cobro exige una
        operación de recepción (PAGO) admitida para no competir con el
        checkout, y no altera precios ni líneas. Body cerrado: solo
        estado=PAGADO con medioPago EFECTIVO/TARJETA/OTRO (sin medioPago →
        400 VALIDATION_ERROR). Pagar una venta ya PAGADO es idempotente con la
        misma clave y devuelve la misma venta: aquí no aplica 409
        SALE_ALREADY_PAID (ese 409 es de la anulación). 200 Venta PAGADO o 202
        con Location y Retry-After 2 si la operación de pago sigue en curso.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload cerrado; el único cambio admitido es registrar el pago.
              required: [estado, medioPago]
              additionalProperties: false
              properties:
                estado:
                  type: string
                  const: PAGADO
                medioPago:
                  type: string
                  enum: [EFECTIVO, TARJETA, OTRO]
                  description: Obligatorio al registrar cada cobro.
      responses:
        '200':
          description: Venta PAGADO (paidAt y medioPago registrados)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVenta'
        '202':
          description: >-
            Pago en curso (operación PAGO admitida aún no terminal); polling
            en Location con Retry-After 2. La respuesta terminal se persiste
            para reintentos con la misma Idempotency-Key.
          headers:
            Location:
              description: GET /api/venta/buscar/{id} de la venta en curso
              schema: {type: string, example: /api/venta/buscar/5001}
            Retry-After:
              schema: {type: integer, example: 2}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [ventas]
      summary: Anular venta impagada (A/E; If-Match + Idempotency-Key; motivo obligatorio)
      operationId: anularVenta
      description: >-
        A/E. Venta PAGADO → 409 SALE_ALREADY_PAID (una venta pagada no se
        anula en el MVP; requiere devolución fuera de alcance). Venta LEGACY
        sin movimiento conciliado → 409 LEGACY_MOVEMENT_UNVERIFIED: no se
        emite restitución sin evidencia y queda conciliación manual. La
        anulación nunca restituye stock por HTTP: emite el comando durable
        stock.restituir (outbox) y la venta pasa a CANCELACION_PENDIENTE con
        202, Location y Retry-After 2; si ya está CANCELADA, el mismo DELETE
        devuelve 200 con el recurso terminal. Motivo obligatorio 1..300.
        Repetir la misma Idempotency-Key devuelve el resultado original
        aunque el recurso ya haya cambiado de estado.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - name: motivo
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 300}
          description: Motivo de la anulación; queda en el historial de la venta.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: >-
            CANCELACION_PENDIENTE: stock.restituir quedó en outbox; polling en
            Location con Retry-After 2 hasta CANCELADA.
          headers:
            Location:
              description: GET /api/venta/buscar/{id} de la venta en curso
              schema: {type: string, example: /api/venta/buscar/5001}
            Retry-After:
              schema: {type: integer, example: 2}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVenta'
        '200':
          description: La venta ya estaba CANCELADA; se devuelve el recurso terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVenta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/venta/operaciones/{operationId}:
    get:
      tags: [ventas]
      summary: Consultar operación de venta (polling; A/E y C solo la propia)
      operationId: consultarOperacionVenta
      description: >-
        A/E; C solo si la operación pertenece a una venta propia (si no, 404
        RESOURCE_NOT_FOUND). Devuelve estado y estadoOperacion para el polling
        sin exponer el payload interno de la operación. Mantener el historial:
        un operationId terminal no se sobrescribe ni se reutiliza.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OperacionVenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOperacionVenta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------- INTERNO (Feign de reception) ----------
  /internal/cierres/{idRecepcion}/resumen:
    get:
      tags: [cierres]
      summary: Resumen de consumos para el cierre (reception; cierres:write)
      operationId: resumenCierreConsumos
      security:
        - machineToken: [cierres:write]
      description: >-
        Feign entrante de reception; no pasa por Gateway y el usuario no puede
        invocarlo (token de usuario no basta). idRecepcion en path e idHotel
        obligatorio en query: el idHotel procede del caller reception y debe
        coincidir con cualquier fila existente (una recepción tiene un solo
        cierre). Totales de ventas CONFIRMADAS de esa estadía y sede; excluye
        rechazadas, canceladas y ventas técnicas PENDIENTE sin admisión. Si
        hay una operación admitida aún no terminal devuelve 409. Cero ventas
        devuelve totales 0 y ventasPendientes [].
      parameters:
        - name: idRecepcion
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: ResumenCierre de la estadía
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResumenCierre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/cierres/confirmar:
    post:
      tags: [cierres]
      summary: Confirmar cierre de consumos (reception; cierres:write; idempotente por closureId)
      operationId: confirmarCierreConsumos
      security:
        - machineToken: [cierres:write]
      description: >-
        Feign entrante de reception; no pasa por Gateway. Idempotency-Key =
        closureId del body (misma clave al reintentar). Con receipt existente
        se devuelve el mismo receipt ANTES de recalcular las ventas pagadas
        ahora; una recepción tiene un solo cierre, otro closureId para la
        misma recepción → 409 sin mutar. Sin receipt, si
        expectedPendingTotal difiere del calculado se rechaza 409 sin mutar.
        En la confirmación las ventas pendientes se marcan PAGADO con el
        medioPago recibido y ese medio queda en el receipt; ventasPagadas []
        e importe 0 son válidos. Serializa con pg_advisory_xact_lock por
        recepción.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
          description: Obligatoria; usar el closureId del body como valor.
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacionCierre'
      responses:
        '200':
          description: Receipt del cierre (mismo receipt en reintentos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT humano de identity (iss=hotel-identity, aud=hotel-api, TTL 15min).
    machineToken:
      type: oauth2
      description: >-
        JWT máquina para Feign /internal/**: client_credentials con Basic
        clientId:secret por TLS (loopback dev permitido). TTL 5min, sub =
        servicio, scope limitado por audiencia; un token de usuario no basta.
      flows:
        clientCredentials:
          tokenUrl: /internal/auth/token
          scopes:
            cierres:write: Reception consulta el resumen de consumos y confirma el cierre de una recepción.
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
      description: Página solicitada (0-based).
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: Tamaño de página; máximo 100.
    IdPath:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
      description: Identificador comercial de la venta (entero ≥1).
    IdHotelQuery:
      name: idHotel
      in: query
      required: true
      schema: {type: integer, minimum: 1}
      description: Sede objetivo (H); debe pertenecer al alcance del token (A cualquiera, E solo asignadas).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: >-
        Obligatoria en POST/PUT/DELETE de negocio; mismo valor y payload al
        reintentar. Misma clave con request distinto → 409
        IDEMPOTENCY_CONFLICT.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, example: '"3"'}
      description: >-
        V; versión/ETag del recurso. Sin header → 428 PRECONDITION_REQUIRED;
        versión distinta → 412 PRECONDITION_FAILED. El retry con la misma
        Idempotency-Key se evalúa antes que If-Match.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: {type: string, format: uuid}
      description: >-
        UUID opcional del cliente; el Gateway lo genera si falta y lo
        propaga/respond en meta.correlationId.
  responses:
    BadRequest:
      description: 400 validación/formato o campo calculado enviado por el cliente (VALIDATION_ERROR)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: 401 token ausente, expirado o inválido (UNAUTHENTICATED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: 403 rol, scope o sede insuficientes (FORBIDDEN)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: 404 inexistente o ajeno a sede/propietario (RESOURCE_NOT_FOUND; anti-enumeración)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: >-
        409 regla de negocio o duplicado: STOCK_INSUFFICIENT, PRODUCT_INACTIVE,
        STAY_NOT_ACTIVE, SALE_ALREADY_PAID, LEGACY_MOVEMENT_UNVERIFIED,
        IDEMPOTENCY_CONFLICT o cierre duplicado; el rechazo durable se
        devuelve sin mutar.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    PreconditionRequired:
      description: 428 falta If-Match (PRECONDITION_REQUIRED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    PreconditionFailed:
      description: 412 versión distinta a la vigente (PRECONDITION_FAILED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unavailable:
      description: >-
        503 dependencia no disponible antes de crear una operación durable
        (DEPENDENCY_UNAVAILABLE); en catálogo/carrito no hay fallback de
        precio.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        data: {type: 'null'}
        error:
          type: object
          required: [code, fields]
          properties:
            code: {type: string}
            fields: {type: object}
        meta: {type: object}
    ApiNull:
      type: object
      required: [success, message, data, meta]
      description: >-
        Envelope de éxito sin datos (data=null); las rutas 204 actuales no
        llevan cuerpo y se conserva para uniformidad del contrato común.
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {type: 'null'}
        meta: {type: object}
    ApiMetaSingle:
      type: object
      description: Meta de respuesta única; correlationId lo propaga el Gateway.
      properties:
        correlationId: {type: string, format: uuid}
    ApiMetaPage:
      type: object
      description: Meta de listas paginadas; page/size/totalElements obligatorios.
      required: [page, size, totalElements]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 0}
        totalElements: {type: integer, minimum: 0}
        correlationId: {type: string, format: uuid}
    VentaAlta:
      type: object
      description: >-
        Alta de venta; JSON cerrado. idHotel e idCliente se derivan de la
        recepción y los precios son autoritativos de inventory.
      required: [idRecepcion, detalles]
      additionalProperties: false
      properties:
        idRecepcion: {type: integer, minimum: 1}
        estado:
          type: string
          enum: [PENDIENTE, PAGADO]
          default: PENDIENTE
          description: >-
            C solo PENDIENTE u omitido; PAGADO (pago manual al crear) es
            exclusivo de A/E y exige medioPago.
        medioPago:
          type: [string, 'null']
          enum: [EFECTIVO, TARJETA, OTRO, null]
          description: Obligatorio si estado=PAGADO; null si aún no se paga.
        detalles:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/VentaDetalleAlta'
      example:
        idRecepcion: 1001
        estado: PENDIENTE
        detalles:
          - idProducto: 1
            cantidad: 2
    VentaDetalleAlta:
      type: object
      description: Línea pedida; sin precios, subtotales ni nombre de producto.
      required: [idProducto, cantidad]
      additionalProperties: false
      properties:
        idProducto: {type: integer, minimum: 1}
        cantidad: {type: integer, minimum: 1, maximum: 9999}
    VentaDetalle:
      type: object
      description: Línea confirmada con el snapshot autoritativo de inventory; inmutable tras confirmar.
      required: [idDetalleVenta, idProducto, nombreProducto, cantidad, precioUnitario, subTotal]
      properties:
        idDetalleVenta: {type: integer, minimum: 1}
        idProducto: {type: integer, minimum: 1}
        nombreProducto: {type: string, maxLength: 120}
        cantidad: {type: integer, minimum: 1}
        precioUnitario: {type: number, multipleOf: 0.01, minimum: 0}
        subTotal: {type: number, multipleOf: 0.01, minimum: 0}
    Venta:
      type: object
      required: [idVenta, idRecepcion, idCliente, idHotel, total, estado, estadoOperacion, operationId, medioPago, version, fechaCreacion, paidAt, detalles]
      properties:
        idVenta: {type: integer, minimum: 1}
        idRecepcion: {type: integer, minimum: 1}
        idCliente: {type: integer, minimum: 1}
        idHotel: {type: integer, minimum: 1}
        total: {type: number, multipleOf: 0.01, minimum: 0}
        estado: {type: string, enum: [PENDIENTE, PAGADO]}
        estadoOperacion: {type: string, enum: [PENDIENTE, CONFIRMADA, RECHAZADA, CANCELACION_PENDIENTE, CANCELADA]}
        operationId:
          type: string
          format: uuid
          description: Operación vigente (VENTA al crear, PAGO al pagar, ANULACION al anular).
        medioPago:
          type: [string, 'null']
          enum: [EFECTIVO, TARJETA, OTRO, null]
          description: >-
            Obligatorio al registrar cada cobro; null = NO_REGISTRADO
            mientras la venta no se paga o en históricos migrados sin dato.
        version: {type: integer, minimum: 1}
        fechaCreacion: {type: string, format: date-time}
        paidAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp del pago; null hasta que la venta se paga.
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/VentaDetalle'
    CarritoItem:
      type: object
      required: [idCarrito, idRecepcion, idPersona, idHotel, idProducto, nombreProducto, precioUnitario, imagenUrl, cantidad, fechaRegistro, version]
      properties:
        idCarrito: {type: integer, minimum: 1}
        idRecepcion: {type: integer, minimum: 1}
        idPersona: {type: integer, minimum: 1}
        idHotel: {type: integer, minimum: 1}
        idProducto: {type: integer, minimum: 1}
        nombreProducto: {type: string, maxLength: 120}
        precioUnitario: {type: number, multipleOf: 0.01, minimum: 0}
        imagenUrl: {type: [string, 'null'], maxLength: 500}
        cantidad: {type: integer, minimum: 1, maximum: 9999}
        fechaRegistro: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    CatalogoItem:
      type: object
      description: Producto de la sede de la estadía según inventory (precio autoritativo).
      required: [idProducto, sku, nombre, detalle, imagenUrl, idHotel, precio, cantidad, umbralBajo, estado, fechaCreacion, version, productoVersion]
      properties:
        idProducto: {type: integer, minimum: 1}
        sku: {type: string, maxLength: 40}
        nombre: {type: string, maxLength: 120}
        detalle: {type: [string, 'null'], maxLength: 500}
        imagenUrl: {type: [string, 'null'], maxLength: 500}
        idHotel: {type: integer, minimum: 1}
        precio: {type: number, multipleOf: 0.01, exclusiveMinimum: 0}
        cantidad: {type: integer, minimum: 0}
        umbralBajo: {type: integer, minimum: 0}
        estado: {type: boolean}
        fechaCreacion: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
        productoVersion: {type: integer, minimum: 1}
      example:
        idProducto: 1
        sku: AGUA-500
        nombre: Agua 500ml
        detalle: Botella de agua de 500 ml
        imagenUrl: /assets/productos/agua-500.png
        idHotel: 1
        precio: 3.50
        cantidad: 20
        umbralBajo: 5
        estado: true
        fechaCreacion: '2026-10-01T10:00:00Z'
        version: 1
        productoVersion: 1
    OperacionVenta:
      type: object
      description: Estado de la operación para polling; no expone el payload interno de request.
      required: [operationId, idVenta, tipo, estado, estadoOperacion]
      properties:
        operationId: {type: string, format: uuid}
        idVenta: {type: integer, minimum: 1}
        tipo: {type: string, enum: [VENTA, PAGO, ANULACION]}
        estado: {type: string, enum: [PREPARANDO, ADMITIDA, DEBITO_SOLICITADO, TERMINAL]}
        estadoOperacion: {type: string, enum: [PENDIENTE, CONFIRMADA, RECHAZADA, CANCELACION_PENDIENTE, CANCELADA]}
    ResumenCierre:
      type: object
      description: Totales de ventas CONFIRMADAS de la estadía para el cierre de consumos.
      required: [idRecepcion, idHotel, totalPendiente, totalPagado, ventasPendientes, hayOperacionesAbiertas]
      properties:
        idRecepcion: {type: integer, minimum: 1}
        idHotel: {type: integer, minimum: 1}
        totalPendiente: {type: number, multipleOf: 0.01, minimum: 0}
        totalPagado: {type: number, multipleOf: 0.01, minimum: 0}
        ventasPendientes:
          type: array
          description: idVenta de las ventas sin pagar que el cierre marcaría PAGADO; puede ser [].
          items: {type: integer, minimum: 1}
        hayOperacionesAbiertas: {type: boolean}
    ConfirmacionCierre:
      type: object
      description: Petición de cierre; jsonb cerrado.
      required: [closureId, idRecepcion, idHotel, expectedPendingTotal, medioPago]
      additionalProperties: false
      properties:
        closureId: {type: string, format: uuid}
        idRecepcion: {type: integer, minimum: 1}
        idHotel: {type: integer, minimum: 1}
        expectedPendingTotal:
          type: number
          multipleOf: 0.01
          minimum: 0
          description: Debe coincidir con el total pendiente calculado; si difiere, 409 sin mutar.
        medioPago:
          type: string
          enum: [EFECTIVO, TARJETA, OTRO]
          description: Medio con el que se pagan las ventas pendientes; queda en el receipt.
    Receipt:
      type: object
      description: Recibo único del cierre de consumos; se devuelve tal cual en reintentos.
      required: [closureId, idRecepcion, idHotel, totalPagadoPrevio, totalPagadoAhora, totalConsumos, medioPago, ventasPagadas, confirmedAt]
      properties:
        closureId: {type: string, format: uuid}
        idRecepcion: {type: integer, minimum: 1}
        idHotel: {type: integer, minimum: 1}
        totalPagadoPrevio: {type: number, multipleOf: 0.01, minimum: 0}
        totalPagadoAhora: {type: number, multipleOf: 0.01, minimum: 0}
        totalConsumos: {type: number, multipleOf: 0.01, minimum: 0}
        medioPago:
          type: [string, 'null']
          enum: [EFECTIVO, TARJETA, OTRO, null]
          description: null = NO_REGISTRADO en históricos migrados sin dato.
        ventasPagadas:
          type: array
          description: idVenta marcadas PAGADO en esta confirmación; [] si no hubo consumos.
          items: {type: integer, minimum: 1}
        confirmedAt: {type: string, format: date-time}
      example:
        closureId: 66666666-6666-4666-8666-666666666666
        idRecepcion: 1001
        idHotel: 1
        totalPagadoPrevio: 0.00
        totalPagadoAhora: 7.00
        totalConsumos: 7.00
        medioPago: EFECTIVO
        ventasPagadas: [5001]
        confirmedAt: '2026-10-05T16:10:00Z'
    ApiVenta:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/Venta'}
        meta: {$ref: '#/components/schemas/ApiMetaSingle'}
    ApiListVenta:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data:
          type: array
          items: {$ref: '#/components/schemas/Venta'}
        meta: {$ref: '#/components/schemas/ApiMetaPage'}
    ApiCarritoItem:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/CarritoItem'}
        meta: {$ref: '#/components/schemas/ApiMetaSingle'}
    ApiListCarritoItem:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data:
          type: array
          items: {$ref: '#/components/schemas/CarritoItem'}
        meta: {$ref: '#/components/schemas/ApiMetaPage'}
    ApiListCatalogoItem:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data:
          type: array
          items: {$ref: '#/components/schemas/CatalogoItem'}
        meta: {$ref: '#/components/schemas/ApiMetaPage'}
    ApiOperacionVenta:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/OperacionVenta'}
        meta: {$ref: '#/components/schemas/ApiMetaSingle'}
    ApiResumenCierre:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/ResumenCierre'}
        meta: {$ref: '#/components/schemas/ApiMetaSingle'}
    ApiReceipt:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/Receipt'}
        meta: {$ref: '#/components/schemas/ApiMetaSingle'}
