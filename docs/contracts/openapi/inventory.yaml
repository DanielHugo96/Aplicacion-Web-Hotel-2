openapi: 3.1.0
info:
  title: Hotel inventory — contrato API
  version: 1.0.0
  description: >-
    Catálogo y stock por sede. No hay REST público: A configura y E lee su sede;
    C solo consume GET /api/venta/catalogo de sales, que valida su estadía y
    llama al catálogo interno. /api/producto no acepta CLIENTE y no hay
    dependencia inventory → reception. Rutas /internal/** exclusivas de Feign
    máquina a máquina con scope stock:read o stock:debit. Mutaciones con
    Idempotency-Key; PUT/DELETE con V (If-Match) usando la version de
    producto_sede. Envelope {success,message,data,meta}; dinero numeric(12,2)
    con redondeo HALF_UP. Fuentes:
    especificacion/microservicios/inventory/api.md y base-de-datos.md,
    especificacion/03-contrato-comun.md, contracts/errors.md.
servers:
  - url: http://localhost:8080
    description: API Gateway local (rutas humanas /api/**)
  - url: http://inventory:8082
    description: Servicio inventory directo (solo rutas /internal/**)
security:
  - bearerAuth: []
tags:
  - name: productos
    description: Catálogo y stock por sede para A/E
  - name: interno
    description: Feign entrante con token máquina y scope
paths:
  /api/producto/listar:
    get:
      tags: [productos]
      summary: Listar productos por sede (A/E)
      description: >-
        A lista cualquier sede y E solo las asignadas (403 fuera de alcance).
        Lista maestra con estado:boolean opcional (default true) y paginación L
        con orden estable por ID ascendente; el estado devuelto es el efectivo
        (producto AND producto_sede) de la sede consultada.
      operationId: listarProductos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/IdHotelQuery'
        - name: estado
          in: query
          required: false
          description: Filtro de baja lógica por sede; default true.
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Producto[] de la sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListProducto'
              example:
                success: true
                message: OK
                data:
                  - idProducto: 1
                    sku: AGUA-500
                    nombre: Agua 500ml
                    detalle: Botella de agua de 500 ml
                    imagenUrl: /assets/productos/agua-500ml.png
                    idHotel: 1
                    precio: 3.50
                    cantidad: 20
                    umbralBajo: 5
                    estado: true
                    fechaCreacion: 2026-09-01T10:00:00Z
                    version: 1
                    productoVersion: 1
                meta:
                  page: 0
                  size: 20
                  totalElements: 1
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/producto/buscar/{id}:
    get:
      tags: [productos]
      summary: Buscar producto en sede (A/E; idHotel obligatorio)
      description: >-
        Producto por sede usa clave compuesta (idProducto,idHotel), por lo que
        idHotel es siempre obligatorio; si el producto no está asignado a esa
        sede responde 404 para no filtrar catálogo ajeno.
      operationId: buscarProducto
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Producto de la sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleProducto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/producto/registrar:
    post:
      tags: [productos]
      summary: Crear producto con asignación inicial (A; 201)
      description: >-
        Crea el producto global y su asignación inicial a la sede indicada en el
        body (precio>0, cantidadInicial>=0, umbralBajo>=0). El SKU es único:
        repetirlo devuelve 409 DUPLICATE_RESOURCE. La misma Idempotency-Key no
        duplica el alta.
      operationId: registrarProducto
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoAlta'
            example:
              sku: AGUA-500
              nombre: Agua 500ml
              detalle: Botella de agua de 500 ml
              imagenUrl: /assets/productos/agua-500ml.png
              idHotel: 1
              precio: 3.50
              cantidadInicial: 20
              umbralBajo: 5
      responses:
        '201':
          description: Producto creado con su asignación inicial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleProducto'
              example:
                success: true
                message: Producto registrado
                data:
                  idProducto: 1
                  sku: AGUA-500
                  nombre: Agua 500ml
                  detalle: Botella de agua de 500 ml
                  imagenUrl: /assets/productos/agua-500ml.png
                  idHotel: 1
                  precio: 3.50
                  cantidad: 20
                  umbralBajo: 5
                  estado: true
                  fechaCreacion: 2026-09-01T10:00:00Z
                  version: 1
                  productoVersion: 1
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/producto/actualizar/{id}:
    put:
      tags: [productos]
      summary: Actualizar producto/sede (A, V; no cantidad)
      description: >-
        nombre/detalle/imagenUrl son globales; precio/umbralBajo/estado
        pertenecen a la sede indicada en idHotel. No permite cantidad: se
        cambia solo con ajustes (POST /api/producto/{id}/ajustes). productoVersion
        del body y V del header se validan juntos en la transacción antes de
        cualquier cambio; precio no altera ventas históricas.
      operationId: actualizarProducto
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoUpdate'
            example:
              nombre: Agua 500ml
              detalle: Botella de agua de 500 ml
              imagenUrl: /assets/productos/agua-500ml.png
              precio: 3.50
              umbralBajo: 5
              estado: true
              productoVersion: 1
      responses:
        '200':
          description: Producto de la sede actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleProducto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/producto/eliminar/{id}:
    delete:
      tags: [productos]
      summary: Baja lógica por sede (A, V; 200)
      description: >-
        Baja lógica por sede conservando las unidades: el producto queda
        inactivo en esa sede (estado=false), no admite nuevas ventas (el débito
        responde 409 PRODUCT_INACTIVE) y sigue permitiendo restituir stock de
        ventas previas; reactivarlo conserva la cantidad y los ajustes de A
        siguen disponibles. No destruye movimientos. Producto.estado global
        queda activo en el MVP y no hay endpoint de baja global: DELETE afecta
        únicamente a la sede. Requiere idHotel, V e Idempotency-Key.
      operationId: eliminarProducto
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Producto inactivo en la sede, con la cantidad conservada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleProducto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/producto/{id}/sedes:
    post:
      tags: [productos]
      summary: Asignar producto a sede nueva (A; 201)
      description: >-
        Alta única de producto_sede con stock inicial>=0; la asignación queda
        activa y serializada con los débitos. Si ya existe la asignación
        responde 409 DUPLICATE_RESOURCE. La activación consulta hotel por Feign,
        por lo que una dependencia caída devuelve 503 antes de crear la
        asignación.
      operationId: asignarProductoSede
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SedeAsignacion'
            example:
              idHotel: 2
              precio: 3.50
              cantidadInicial: 20
              umbralBajo: 5
      responses:
        '201':
          description: Producto de la sede nueva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleProducto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/producto/{id}/ajustes:
    post:
      tags: [productos]
      summary: Ajuste manual de stock (A, V; 201)
      description: >-
        Ajuste administrativo con lock de stock: delta entero distinto de 0 y
        motivo 1..300; el saldo resultante nunca puede ser negativo. No permite
        reemplazar la cantidad de forma arbitraria ni sustituye el débito de
        ventas. Deja ajuste_stock con actor auditado.
      operationId: ajustarStock
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteRequest'
            example:
              idHotel: 1
              delta: 5
              motivo: Reposición de inventario
      responses:
        '201':
          description: Ajuste registrado con el saldo resultante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleAjusteResultado'
              example:
                success: true
                message: Ajuste registrado
                data:
                  ajusteId: 40000000-0000-4000-8000-000000000004
                  cantidad: 25
                  version: 2
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          description: >-
            400 VALIDATION_ERROR cuando delta es 0, el motivo está fuera de
            1..300 o el ajuste dejaría saldo negativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                message: Revisa los datos marcados.
                data: null
                error:
                  code: VALIDATION_ERROR
                  fields:
                    delta: El ajuste dejaría un saldo negativo
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/producto/{id}/movimientos:
    get:
      tags: [productos]
      summary: Movimientos por producto (A/E; 200)
      description: >-
        Unión discriminada por tipo: VENTA refleja el movimiento y su estado
        actual (DESCONTADO/RECHAZADO/RESTITUIDO) sin duplicar débitos por tener
        dos timestamps; AJUSTE refleja ajustes manuales. inicio/fin opcionales
        ISO-8601 con intervalo [inicio, fin) sobre createdAt; orden estable por
        createdAt, id/tipo. Sin detalle de producto por rechazo o lápida
        anterior al débito no aparece en esta ruta; sí en la consulta interna
        por idVenta.
      operationId: movimientosProducto
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: inicio
          in: query
          required: false
          description: Desde (incluido) en ISO-8601; intervalo [inicio, fin).
          schema:
            type: string
            format: date-time
        - name: fin
          in: query
          required: false
          description: Hasta (excluido) en ISO-8601; intervalo [inicio, fin).
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Movimiento[] de la sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListMovimiento'
              example:
                success: true
                message: OK
                data:
                  - tipo: VENTA
                    idVenta: 5001
                    idHotel: 1
                    estado: DESCONTADO
                    cantidad: 2
                    precioUnitario: 3.50
                    createdAt: 2026-10-05T14:00:00Z
                    updatedAt: 2026-10-05T14:00:00Z
                  - tipo: AJUSTE
                    ajusteId: 40000000-0000-4000-8000-000000000004
                    idHotel: 1
                    delta: 5
                    motivo: Reposición de inventario
                    createdAt: 2026-10-05T15:00:00Z
                meta:
                  page: 0
                  size: 20
                  totalElements: 2
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/productos:
    get:
      tags: [interno]
      summary: Catálogo interno por sede (máquina; stock:read)
      description: >-
        Solo caller sales con token máquina y scope stock:read; catálogo que
        sales usa para los clientes, siempre en estado activo. Un token humano
        no basta para /internal/**.
      operationId: listarProductosInterno
      security:
        - machineToken: [stock:read]
      parameters:
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: estado
          in: query
          required: false
          description: Fijo true para el catálogo de clientes.
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Producto[] activo de la sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListProducto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /internal/productos/{id}:
    get:
      tags: [interno]
      summary: Producto interno por sede (máquina; stock:read)
      description: >-
        Solo caller sales con scope stock:read. Clave compuesta
        (idProducto,idHotel): el producto se busca en la sede indicada y 404 si
        allí no existe o está inactivo.
      operationId: obtenerProductoInterno
      security:
        - machineToken: [stock:read]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdHotelQuery'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Producto de la sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleProducto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/stock/descontar:
    post:
      tags: [interno]
      summary: Descontar stock por venta (máquina; stock:debit)
      description: >-
        Solo caller sales con scope stock:debit e Idempotency-Key estable por
        venta; además UNIQUE idVenta evita duplicados incluso con otra clave
        HTTP. Sin precios, nombres, total ni recepción: inventory confía solo en
        sales autenticado y no acepta token CLIENTE. Mismo idVenta+hash devuelve
        el mismo resultado (200) aunque cambie el catálogo; otro hash responde
        409 IDEMPOTENCY_CONFLICT. Todos o ninguno: una línea insuficiente deja
        stock intacto y registra RECHAZADO. IDs duplicados en items se rechazan
        400 antes de SQL, sin sumar ocultamente.
      operationId: descontarStock
      security:
        - machineToken: [stock:debit]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Debito'
            example:
              idVenta: 5001
              idHotel: 1
              items:
                - idProducto: 1
                  cantidad: 2
      responses:
        '200':
          description: Débito aplicado con precios y nombres autoritativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleDebitoResultado'
              example:
                success: true
                message: Stock descontado
                data:
                  idVenta: 5001
                  idHotel: 1
                  estado: DESCONTADO
                  moneda: PEN
                  total: 7.00
                  items:
                    - idProducto: 1
                      nombreProducto: Agua 500ml
                      cantidad: 2
                      precioUnitario: 3.50
                      subTotal: 7.00
                  version: 1
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Rechazo durable sin descuento parcial: STOCK_INSUFFICIENT si falta
            alguna línea, PRODUCT_INACTIVE si el producto o su sede están
            inactivos, DEBIT_CANCELLED si una lápida RESTITUIDO bloquea el
            débito tardío o IDEMPOTENCY_CONFLICT si el hash del débito difiere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                message: No hay stock suficiente de uno o más productos.
                data: null
                error:
                  code: STOCK_INSUFFICIENT
                  fields:
                    cantidad: '15'
                meta:
                  correlationId: 11111111-1111-4111-8111-111111111111
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/stock/movimientos/{idVenta}:
    get:
      tags: [interno]
      summary: Consultar movimiento por venta (máquina; stock:read)
      description: >-
        Solo caller sales con scope stock:read. Devuelve el desenlace del
        débito por venta (DESCONTADO/RECHAZADO/RESTITUIDO) con su resultado
        inmutable y versión; 404 si no hay registro. Un DESCONTADO tardío nunca
        confirma una venta por sí solo y un RESTITUIDO sin descuento previo
        bloquea futuros débitos de esa venta.
      operationId: movimientoPorVenta
      security:
        - machineToken: [stock:read]
      parameters:
        - name: idVenta
          in: path
          required: true
          description: Identificador externo de la venta (sales_db).
          schema:
            type: integer
            minimum: 1
            example: 5001
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resumen del movimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSingleMovimientoResumen'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT humano RS256 de identity (iss=hotel-identity, aud=hotel-api,
        TTL 15min) con claim sedes para A/E; /api/producto no acepta CLIENTE.
    machineToken:
      type: oauth2
      description: >-
        JWT máquina obtenido en POST /internal/auth/token con
        grant_type=client_credentials y Basic clientId:secret por TLS; aud=destino,
        TTL 5min y scope limitado por audiencia. Solo para /internal/** en red
        privada; un token humano no basta.
      flows:
        clientCredentials:
          tokenUrl: /internal/auth/token
          scopes:
            stock:read: sales consulta catálogo y resultado de movimientos
            stock:debit: sales descuenta stock de una venta confirmada
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Página L base 0.
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      required: false
      description: Tamaño de página L entre 1 y 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador comercial del recurso.
      schema: {type: integer, minimum: 1}
    IdHotelQuery:
      name: idHotel
      in: query
      required: true
      description: Sede H; E solo puede operar en sus sedes asignadas.
      schema: {type: integer, minimum: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID obligatorio en mutaciones; el mismo valor al reintentar. Misma
        clave con request distinto devuelve 409 IDEMPOTENCY_CONFLICT.
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Versión V de producto_sede entre comillas, por ejemplo "1"; ausente
        428, distinta 412.
      schema: {type: string}
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: UUID opcional del cliente; el Gateway lo genera si falta y lo propaga/responde.
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: 400 validación/formato, JSON cerrado o campo calculado enviado por el cliente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Revisa los datos marcados.
            data: null
            error:
              code: VALIDATION_ERROR
              fields:
                cantidad: La cantidad debe estar entre 1 y 9999
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: 401 token ausente, expirado o con firma/issuer/audience inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Tu sesión expiró. Vuelve a iniciar sesión.
            data: null
            error:
              code: UNAUTHENTICATED
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: 403 rol, scope o sede insuficientes; CLIENTE no puede llamar /api/producto ni /internal/**.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: No tienes permiso para esta acción.
            data: null
            error:
              code: FORBIDDEN
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: 404 inexistente o ajeno a sede (anti-enumeración).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: No encontramos lo que buscas.
            data: null
            error:
              code: RESOURCE_NOT_FOUND
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: 409 regla de negocio o duplicado sin efectos parciales.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Ese valor ya está registrado.
            data: null
            error:
              code: DUPLICATE_RESOURCE
              fields:
                sku: AGUA-500
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    PreconditionFailed:
      description: 412 If-Match con versión distinta al ETag vigente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Otra persona modificó este registro. Recarga para ver los cambios.
            data: null
            error:
              code: PRECONDITION_FAILED
              fields:
                If-Match: '1'
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    PreconditionRequired:
      description: 428 falta If-Match en un PUT/DELETE con V.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Falta la versión del registro.
            data: null
            error:
              code: PRECONDITION_REQUIRED
              fields:
                If-Match: ausente
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: 503 dependencia no disponible antes de crear una operación durable.
      headers:
        Retry-After:
          schema: {type: integer, example: 5}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: El servicio no está disponible. Reintenta en unos segundos.
            data: null
            error:
              code: DEPENDENCY_UNAVAILABLE
              fields: {}
            meta:
              correlationId: 11111111-1111-4111-8111-111111111111
  schemas:
    ProductoAlta:
      type: object
      description: >-
        Alta de producto global con asignación inicial a la sede indicada.
        Precio>0, cantidadInicial>=0 y umbralBajo>=0; sku único.
      required: [sku, nombre, idHotel, precio, cantidadInicial, umbralBajo]
      properties:
        sku:
          type: string
          maxLength: 40
          description: Único; repetido devuelve 409 DUPLICATE_RESOURCE.
          example: AGUA-500
        nombre:
          type: string
          maxLength: 120
          example: Agua 500ml
        detalle:
          type: string
          maxLength: 500
        imagenUrl:
          type: string
          maxLength: 500
          description: https allowlist o /assets/.
        idHotel:
          type: integer
          minimum: 1
          example: 1
        precio:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
          example: 3.50
        cantidadInicial:
          type: integer
          minimum: 0
          example: 20
        umbralBajo:
          type: integer
          minimum: 0
          description: Alerta de bajo stock cuando cantidad <= umbralBajo.
          example: 5
    ProductoUpdate:
      type: object
      description: >-
        nombre/detalle/imagenUrl son globales; precio/umbralBajo/estado
        pertenecen a la sede indicada en idHotel. No permite cantidad.
        productoVersion y V se validan juntos en la transacción antes de
        cualquier cambio; cada producto_sede afectado incrementa su version y
        emite snapshot.
      required: [productoVersion]
      properties:
        nombre:
          type: string
          maxLength: 120
        detalle:
          type: string
          maxLength: 500
        imagenUrl:
          type: string
          maxLength: 500
        precio:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
        umbralBajo:
          type: integer
          minimum: 0
        estado:
          type: boolean
          description: Pertenece solo a producto_sede (baja/reactivación por sede).
        productoVersion:
          type: integer
          minimum: 1
          description: Versión del catálogo global exigida en el body.
          example: 1
    Producto:
      type: object
      description: >-
        Producto en una sede. estado es el estado efectivo (producto AND
        producto_sede); version es la de producto_sede y alimenta If-Match;
        productoVersion es la del catálogo global.
      required: [idProducto, sku, nombre, detalle, imagenUrl, idHotel, precio,
        cantidad, umbralBajo, estado, fechaCreacion, version, productoVersion]
      properties:
        idProducto:
          type: integer
          minimum: 1
          example: 1
        sku:
          type: string
          maxLength: 40
          example: AGUA-500
        nombre:
          type: string
          maxLength: 120
          example: Agua 500ml
        detalle:
          type: [string, 'null']
          maxLength: 500
        imagenUrl:
          type: [string, 'null']
          maxLength: 500
        idHotel:
          type: integer
          minimum: 1
          example: 1
        precio:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
          example: 3.50
        cantidad:
          type: integer
          minimum: 0
          description: Unidades disponibles; nunca negativas.
          example: 20
        umbralBajo:
          type: integer
          minimum: 0
          example: 5
        estado:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time
          example: 2026-09-01T10:00:00Z
        version:
          type: integer
          minimum: 1
          description: Versión de producto_sede; es el V de If-Match.
          example: 1
        productoVersion:
          type: integer
          minimum: 1
          description: Versión del catálogo global de producto.
          example: 1
    SedeAsignacion:
      type: object
      description: Asignación inicial de un producto existente a una sede nueva; alta única.
      required: [idHotel, precio, cantidadInicial, umbralBajo]
      properties:
        idHotel:
          type: integer
          minimum: 1
          example: 2
        precio:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
          example: 3.50
        cantidadInicial:
          type: integer
          minimum: 0
          example: 20
        umbralBajo:
          type: integer
          minimum: 0
          example: 5
    AjusteRequest:
      type: object
      description: Ajuste administrativo de stock con lock; el saldo resultante nunca queda negativo.
      required: [idHotel, delta, motivo]
      properties:
        idHotel:
          type: integer
          minimum: 1
          example: 1
        delta:
          type: integer
          not: {const: 0}
          description: Entero distinto de 0; positivo repone y negativo descuenta por corrección.
          example: 5
        motivo:
          type: string
          minLength: 1
          maxLength: 300
          example: Reposición de inventario
    AjusteResultado:
      type: object
      required: [ajusteId, cantidad, version]
      properties:
        ajusteId:
          type: string
          format: uuid
          example: 40000000-0000-4000-8000-000000000004
        cantidad:
          type: integer
          minimum: 0
          description: Saldo resultante tras el ajuste.
          example: 25
        version:
          type: integer
          minimum: 1
          description: Nueva versión de producto_sede.
          example: 2
    MovimientoVenta:
      type: object
      description: >-
        Movimiento de venta con su estado actual; un solo registro por venta
        aunque tenga createdAt y updatedAt, sin doble débito en reportes.
      required: [tipo, idVenta, idHotel, estado, cantidad, precioUnitario, createdAt, updatedAt]
      properties:
        tipo:
          type: string
          const: VENTA
        idVenta:
          type: integer
          minimum: 1
          example: 5001
        idHotel:
          type: integer
          minimum: 1
          example: 1
        estado:
          type: string
          enum: [DESCONTADO, RECHAZADO, RESTITUIDO]
        cantidad:
          type: integer
          minimum: 1
          example: 2
        precioUnitario:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
          description: Precio autoritativo usado en el débito; no lo envía sales.
          example: 3.50
        createdAt:
          type: string
          format: date-time
          example: 2026-10-05T14:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-05T14:00:00Z
    MovimientoAjuste:
      type: object
      description: Ajuste manual de stock visible en el historial del producto.
      required: [tipo, ajusteId, idHotel, delta, motivo, createdAt]
      properties:
        tipo:
          type: string
          const: AJUSTE
        ajusteId:
          type: string
          format: uuid
          example: 40000000-0000-4000-8000-000000000004
        idHotel:
          type: integer
          minimum: 1
          example: 1
        delta:
          type: integer
          not: {const: 0}
          example: 5
        motivo:
          type: string
          minLength: 1
          maxLength: 300
          example: Reposición de inventario
        createdAt:
          type: string
          format: date-time
          example: 2026-10-05T15:00:00Z
    Movimiento:
      oneOf:
        - $ref: '#/components/schemas/MovimientoVenta'
        - $ref: '#/components/schemas/MovimientoAjuste'
      discriminator:
        propertyName: tipo
        mapping:
          VENTA: '#/components/schemas/MovimientoVenta'
          AJUSTE: '#/components/schemas/MovimientoAjuste'
    Debito:
      type: object
      description: >-
        Débito solicitado por sales. Sin precios, nombres, total ni recepción.
        Inventory confía solo en sales autenticado; no acepta token CLIENTE.
        Idempotency-Key estable por venta y UNIQUE idVenta evitan duplicados
        incluso con otra clave HTTP. IDs duplicados en items se rechazan 400
        antes de SQL, sin sumar ocultamente.
      required: [idVenta, idHotel, items]
      properties:
        idVenta:
          type: integer
          minimum: 1
          example: 5001
        idHotel:
          type: integer
          minimum: 1
          example: 1
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/DebitoItem'
    DebitoItem:
      type: object
      required: [idProducto, cantidad]
      properties:
        idProducto:
          type: integer
          minimum: 1
          example: 1
        cantidad:
          type: integer
          minimum: 1
          maximum: 9999
          example: 2
    DebitoResultado:
      type: object
      description: >-
        Resultado autoritativo del débito con precios y nombres congelados;
        importes HALF_UP a 2 decimales. No se reescribe al restituir: se
        conserva para auditoría.
      required: [idVenta, idHotel, estado, total, items, version]
      properties:
        idVenta:
          type: integer
          minimum: 1
          example: 5001
        idHotel:
          type: integer
          minimum: 1
          example: 1
        estado:
          type: string
          const: DESCONTADO
        moneda:
          type: string
          const: PEN
        total:
          type: number
          multipleOf: 0.01
          minimum: 0
          example: 7.00
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DebitoResultadoItem'
        version:
          type: integer
          minimum: 1
          example: 1
    DebitoResultadoItem:
      type: object
      required: [idProducto, nombreProducto, cantidad, precioUnitario, subTotal]
      properties:
        idProducto:
          type: integer
          minimum: 1
          example: 1
        nombreProducto:
          type: string
          maxLength: 120
          description: Snapshot del nombre al momento del débito.
          example: Agua 500ml
        cantidad:
          type: integer
          minimum: 1
          example: 2
        precioUnitario:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
          example: 3.50
        subTotal:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
          example: 7.00
    MovimientoResumen:
      type: object
      description: >-
        Desenlace del débito por venta. resultado es inmutable y su forma
        depende del estado (DESCONTADO con items y total; RECHAZADO con motivo;
        RESTITUIDO conserva el original y añade restituidoAt, o lápida sin
        items). 404 sin registro.
      required: [idVenta, idHotel, estado, resultado, version]
      properties:
        idVenta:
          type: integer
          minimum: 1
          example: 5001
        idHotel:
          type: integer
          minimum: 1
          example: 1
        estado:
          type: string
          enum: [DESCONTADO, RECHAZADO, RESTITUIDO]
        resultado:
          type: [object, 'null']
          description: jsonb inmutable con el desenlace del débito.
        version:
          type: integer
          minimum: 1
          example: 1
    ApiMetaSingle:
      type: object
      required: [correlationId]
      properties:
        correlationId:
          type: string
          format: uuid
    ApiMetaPage:
      type: object
      required: [page, size, totalElements, correlationId]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        correlationId:
          type: string
          format: uuid
    ApiSingleProducto:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Producto'
        meta:
          $ref: '#/components/schemas/ApiMetaSingle'
    ApiListProducto:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Producto'
        meta:
          $ref: '#/components/schemas/ApiMetaPage'
    ApiSingleAjusteResultado:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/AjusteResultado'
        meta:
          $ref: '#/components/schemas/ApiMetaSingle'
    ApiListMovimiento:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Movimiento'
        meta:
          $ref: '#/components/schemas/ApiMetaPage'
    ApiSingleDebitoResultado:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/DebitoResultado'
        meta:
          $ref: '#/components/schemas/ApiMetaSingle'
    ApiSingleMovimientoResumen:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/MovimientoResumen'
        meta:
          $ref: '#/components/schemas/ApiMetaSingle'
    ApiNull:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: 'null'
        meta:
          $ref: '#/components/schemas/ApiMetaSingle'
    ApiError:
      type: object
      required: [success, message, data, error, meta]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        data:
          type: 'null'
        error:
          type: object
          required: [code, fields]
          properties:
            code:
              type: string
              example: STOCK_INSUFFICIENT
            fields:
              type: object
        meta:
          $ref: '#/components/schemas/ApiMetaSingle'
