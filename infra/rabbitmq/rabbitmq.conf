# RabbitMQ del proyecto `hotel` (plan infra-compose).
#
# Vhost del proyecto, usuario de administración y carga de definiciones. Los
# usuarios de servicio y sus permisos por rol productor/consumidor viven en el
# archivo de definiciones que genera `entrypoint.sh` al arrancar desde las
# variables de entorno (`load_definitions`). RabbitMQ interpola `${VARIABLE}`
# desde el entorno del contenedor.

default_vhost = /hotel-demo
default_user = ${RABBITMQ_ADMIN_USER}
default_pass = ${RABBITMQ_ADMIN_PASSWORD}

load_definitions = /etc/rabbitmq/definitions.json
