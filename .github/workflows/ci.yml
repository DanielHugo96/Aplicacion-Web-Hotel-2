name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Build de los nueve modulos
        run: ./mvnw -f services/pom.xml verify

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [public-web, admin-web]
    steps:
      - uses: actions/checkout@v4
      - name: Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Instalar dependencias
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build
      - name: Pruebas
        working-directory: apps/${{ matrix.app }}
        run: npm test -- --watch=false

  planes:
    name: Planes (validador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar planes
        run: python scripts/validar-planes.py
      - name: Validar contratos (solo aditivos)
        run: python scripts/validar-contratos.py --base origin/main
