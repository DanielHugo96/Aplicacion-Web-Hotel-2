spring:
  application:
    name: identity-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:identity_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # Cuerpo JSON cerrado: un campo que el DTO no declara es VALIDATION_ERROR (por ejemplo
      # `idTipoPersona` en el registro público), no se ignora en silencio.
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrador separado del runtime: en dev se provee por entorno; si falta, hereda el datasource.
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:identity_app}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validación local del issuer fijo y JWKS explícito, sin descubrimiento OIDC.
          issuer-uri: ${JWT_ISSUER:hotel-identity}
          jwk-set-uri: ${JWK_SET_URI:http://identity-service/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Sin metadatos (broker caido) el poller no debe bloquearse: falla y reintenta.
        max.block.ms: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:identity}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/hotel-demo}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
server:
  port: 8081

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    username: ${EUREKA_USERNAME:}
    password: ${EUREKA_PASSWORD:}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # readiness solo con la base de datos del servicio arriba.
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash
  level:
    root: ${LOG_LEVEL:INFO}

hotel:
  identity:
    # Clave privada RS256 fuera de Git: aquí va la ruta, nunca la clave.
    # Vacía solo se admite en dev/demo (clave efímera); en el resto de perfiles el arranque falla.
    signing-key-file: ${IDENTITY_SIGNING_KEY_FILE:}
    jwk-kid: ${IDENTITY_JWK_KID:v1}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:15}
    machine-token-ttl-minutes: ${MACHINE_TOKEN_TTL_MINUTES:5}
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:5}
    registro-rate-limit-per-minute: ${REGISTRO_RATE_LIMIT_PER_MINUTE:3}
    anonimizar-inactivos-anios: ${ANONIMIZAR_INACTIVOS_ANIOS:5}
    # HMAC del request_hash de los requests con credenciales (registro y cambio de clave).
    # Por defecto usa el secreto propio del servicio, que ya es obligatorio y vive fuera de Git.
    idempotency-hmac-key: ${IDENTITY_IDEMPOTENCY_HMAC_KEY:${SERVICE_CLIENT_SECRET:}}
  demo:
    # Solo perfiles dev/demo. Sin DEMO_PASSWORD no se siembran credenciales de personas.
    password: ${DEMO_PASSWORD:}
    # Secretos de los clientes de servicio que siembra identity, distintos por servicio.
    service-client-secrets:
      identity: ${SERVICE_CLIENT_SECRET:}
      reception: ${SERVICE_CLIENT_RECEPTION_SECRET:}
      hotel: ${SERVICE_CLIENT_HOTEL_SECRET:}
      inventory: ${SERVICE_CLIENT_INVENTORY_SECRET:}
      sales: ${SERVICE_CLIENT_SALES_SECRET:}
  security:
    machine:
      # Token máquina: identity llama a hotel por /internal/**. Secreto fuera de Git.
      client-id: ${SERVICE_CLIENT_ID:}
      client-secret: ${SERVICE_CLIENT_SECRET:}
  feign:
    connect-timeout-ms: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${FEIGN_READ_TIMEOUT_MS:5000}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    alert-attempts: ${OUTBOX_ALERT_ATTEMPTS:10}
    alert-pending-minutes: ${OUTBOX_ALERT_PENDING_MINUTES:15}
  inbox:
    retention-days: ${INBOX_RETENTION_DAYS:30}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    schemas-location: ${MESSAGING_SCHEMAS_LOCATION:schemas}
    kafka:
      consumer-group: ${MESSAGING_KAFKA_CONSUMER_GROUP:}

resilience4j:
  circuitbreaker:
    sliding-window-size: ${CB_WINDOW_SIZE:10}
    failure-rate-threshold: ${CB_FAILURE_RATE:50}
    minimum-number-of-calls: ${CB_MIN_CALLS:5}
    wait-duration-in-open-state: ${CB_OPEN_MS:10000}
    permitted-number-of-calls-in-half-open-state: ${CB_HALF_OPEN_CALLS:3}
