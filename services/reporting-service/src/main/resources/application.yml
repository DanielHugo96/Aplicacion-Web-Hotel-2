spring:
  application:
    name: reporting-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/reporting_db}
    username: ${SPRING_DATASOURCE_USERNAME:reporting_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrador separado del runtime: en dev se provee por entorno; si falta, hereda el datasource.
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:reporting_app}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validación local del issuer fijo y JWKS explícito, sin descubrimiento OIDC.
          issuer-uri: ${JWT_ISSUER:hotel-identity}
          jwk-set-uri: ${JWK_SET_URI:http://identity-service/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: ${MESSAGING_KAFKA_CONSUMER_GROUP:reporting-proyeccion-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

server:
  port: 8086

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    username: ${EUREKA_USERNAME:}
    password: ${EUREKA_PASSWORD:}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # readiness solo con la base de datos del servicio arriba.
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash
  level:
    root: ${LOG_LEVEL:INFO}

hotel:
  inbox:
    retention-days: ${INBOX_RETENTION_DAYS:30}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    schemas-location: ${MESSAGING_SCHEMAS_LOCATION:schemas}
    kafka:
      consumer-group: ${MESSAGING_KAFKA_CONSUMER_GROUP:reporting-proyeccion-v1}
  reporting:
    # Máximo de días por intervalo de reporte (docs/especificacion/microservicios/reporting/api.md).
    max-range-days: ${REPORT_MAX_RANGE_DAYS:366}
    # Fuera de este umbral sin conexión activa la proyección no es utilizable (503).
    degraded-timeout-minutes: ${REPORTING_DEGRADED_TIMEOUT_MINUTES:5}
    connection-check-interval-ms: ${REPORTING_CONNECTION_CHECK_INTERVAL_MS:30000}
    bootstrap:
      enabled: ${REPORTING_BOOTSTRAP_ENABLED:true}
      # Fixture de dev/demo derivado del seed terminado; nunca inventa ventas ni estadías.
      seed-location: ${REPORTING_BOOTSTRAP_SEED:classpath:bootstrap/demo-seed.json}
      # Conteos esperados por dominio del seed terminado (REP03).
      dominios:
        personas: 6
        hoteles: 3
        habitaciones: 6
        productosSede: 9
        ventas: 0
        recepciones: 0
      # Watermarks de una exportación/seed terminado. Demo sin stream previo: -1 en cada topic.
      watermarks:
        - {topic: identity.persona.v1, partition: 0, lastOffset: -1}
        - {topic: hotel.sede.v1, partition: 0, lastOffset: -1}
        - {topic: hotel.habitacion.v1, partition: 0, lastOffset: -1}
        - {topic: reception.recepcion.v1, partition: 0, lastOffset: -1}
        - {topic: inventory.stock.v1, partition: 0, lastOffset: -1}
        - {topic: sales.venta.v1, partition: 0, lastOffset: -1}
