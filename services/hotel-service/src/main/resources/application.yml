spring:
  application:
    name: hotel-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/hotel_db}
    username: ${SPRING_DATASOURCE_USERNAME:hotel_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrador separado del runtime: en dev se provee por entorno; si falta, hereda el datasource.
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:hotel_app}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validación local del issuer fijo y JWKS explícito, sin descubrimiento OIDC.
          issuer-uri: ${JWT_ISSUER:hotel-identity}
          jwk-set-uri: ${JWK_SET_URI:http://identity-service/.well-known/jwks.json}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:5000}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Sin metadatos (broker caido) el poller no debe bloquearse: falla y reintenta.
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: ${MESSAGING_KAFKA_CONSUMER_GROUP:hotel-ocupacion-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/hotel-demo}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
server:
  port: 8082

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    username: ${EUREKA_USERNAME:}
    password: ${EUREKA_PASSWORD:}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # readiness solo con la base de datos del servicio arriba.
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash
  level:
    root: ${LOG_LEVEL:INFO}

hotel:
  security:
    machine:
      # Token máquina: este servicio llama rutas /internal/** de otros servicios. Secreto fuera de Git.
      client-id: ${SERVICE_CLIENT_ID:}
      client-secret: ${SERVICE_CLIENT_SECRET:}
  identity:
    token-url: ${IDENTITY_TOKEN_URL:http://localhost:8081/internal/auth/token}
  feign:
    connect-timeout-ms: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${FEIGN_READ_TIMEOUT_MS:5000}
    url:
      reception: ${FEIGN_URL_RECEPTION:http://localhost:8083}
  operaciones:
    recovery-interval-ms: ${OPERACION_RECOVERY_INTERVAL_MS:15000}
    recovery-batch-size: ${OPERACION_RECOVERY_BATCH_SIZE:20}
    recovery-max-backoff-seconds: ${OPERACION_RECOVERY_MAX_BACKOFF_SECONDS:300}
    alert-pending-minutes: ${OPERACION_ALERT_PENDING_MINUTES:10}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    alert-attempts: ${OUTBOX_ALERT_ATTEMPTS:10}
    alert-pending-minutes: ${OUTBOX_ALERT_PENDING_MINUTES:15}
  inbox:
    retention-days: ${INBOX_RETENTION_DAYS:30}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    schemas-location: ${MESSAGING_SCHEMAS_LOCATION:schemas}
    kafka:
      consumer-group: ${MESSAGING_KAFKA_CONSUMER_GROUP:hotel-ocupacion-v1}

resilience4j:
  circuitbreaker:
    sliding-window-size: ${CB_WINDOW_SIZE:10}
    failure-rate-threshold: ${CB_FAILURE_RATE:50}
    minimum-number-of-calls: ${CB_MIN_CALLS:5}
    wait-duration-in-open-state: ${CB_OPEN_MS:10000}
    permitted-number-of-calls-in-half-open-state: ${CB_HALF_OPEN_CALLS:3}
